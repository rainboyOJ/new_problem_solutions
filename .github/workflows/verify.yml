name: Verify pull requests

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pre-push verification
        run: npm run verify:push
