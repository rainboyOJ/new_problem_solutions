<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-active" x="-12%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.25" />
    </filter>
    <filter id="shadow-target" x="-12%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16a34a" flood-opacity="0.3" />
    </filter>
    <filter id="shadow-skip" x="-12%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.25" />
    </filter>

    <!-- 箭头标记 -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>
  </defs>

  <!-- 顶部标题与背景板 -->
  <rect x="20" y="15" width="980" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="40" y="44" font-size="18" font-weight="700" fill="#0f172a">线段树上按和下降（二分定位查询示例）</text>
  <text x="40" y="68" font-size="13" fill="#475569">
    示例：序列 A=[2, 1, 3, 2, 4, 1, 5, 2] ，执行查询 
    <tspan font-weight="700" fill="#2563eb">query(l = 3, t = 8)</tspan> 
    ，求最小的 <tspan font-weight="700" fill="#16a34a">r</tspan> 使得 A[3..r] 之和达到 8（初始余量 <tspan font-weight="700" fill="#ea580c">rem = 8</tspan>）
  </text>

  <!-- 图例 Legend -->
  <g transform="translate(680, 26)">
    <circle cx="10" cy="12" r="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="22" y="16" font-size="11" fill="#334155">深入路径</text>

    <circle cx="85" cy="12" r="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <text x="97" y="16" font-size="11" fill="#334155">整段跳过扣减</text>

    <circle cx="185" cy="12" r="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="197" y="16" font-size="11" fill="#334155">命中目标</text>

    <circle cx="255" cy="12" r="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="267" y="16" font-size="11" fill="#64748b">剪枝/未访问</text>
  </g>

  <!-- 连线层 -->
  <g stroke-linecap="round">
    <!-- Root [1,8] to [1,4] (Search) -->
    <line x1="470" y1="140" x2="260" y2="195" stroke="#2563eb" stroke-width="2.5" />
    <!-- Root [1,8] to [5,8] (Search) -->
    <line x1="490" y1="140" x2="700" y2="195" stroke="#2563eb" stroke-width="2.5" />

    <!-- [1,4] to [1,2] (Pruned) -->
    <line x1="240" y1="235" x2="150" y2="285" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3" />
    <!-- [1,4] to [3,4] (Skipped) -->
    <line x1="260" y1="235" x2="350" y2="285" stroke="#ea580c" stroke-width="2" />

    <!-- [5,8] to [5,6] (Search) -->
    <line x1="700" y1="235" x2="590" y2="285" stroke="#2563eb" stroke-width="2.5" />
    <!-- [5,8] to [7,8] (Unvisited) -->
    <line x1="720" y1="235" x2="810" y2="285" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- [1,2] to leaves (Pruned) -->
    <line x1="140" y1="325" x2="90" y2="375" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="150" y1="325" x2="200" y2="375" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- [3,4] to leaves (Skipped, unvisited) -->
    <line x1="350" y1="325" x2="300" y2="375" stroke="#fed7aa" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="360" y1="325" x2="410" y2="375" stroke="#fed7aa" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- [5,6] to leaves: [5,5] (Target!) and [6,6] (Unvisited) -->
    <line x1="580" y1="325" x2="530" y2="375" stroke="#16a34a" stroke-width="2.5" />
    <line x1="595" y1="325" x2="640" y2="375" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- [7,8] to leaves (Unvisited) -->
    <line x1="810" y1="325" x2="750" y2="375" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="820" y1="325" x2="860" y2="375" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>

  <!-- 节点层 -->
  <!-- Level 0: Root [1,8] -->
  <g transform="translate(430, 95)" filter="url(#shadow-active)">
    <rect width="100" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="50" y="20" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">[1..8]</text>
    <text x="50" y="37" font-size="11" fill="#2563eb" text-anchor="middle">区间和: 20</text>
  </g>

  <!-- Level 1: [1,4] -->
  <g transform="translate(205, 190)" filter="url(#shadow-active)">
    <rect width="90" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="45" y="19" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">[1..4]</text>
    <text x="45" y="35" font-size="11" fill="#2563eb" text-anchor="middle">区间和: 8</text>
  </g>

  <!-- Level 1: [5,8] -->
  <g transform="translate(665, 190)" filter="url(#shadow-active)">
    <rect width="90" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="45" y="19" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">[5..8]</text>
    <text x="45" y="35" font-size="11" fill="#2563eb" text-anchor="middle">区间和: 12</text>
  </g>

  <!-- Level 2: [1,2] (Pruned) -->
  <g transform="translate(100, 280)" filter="url(#shadow)">
    <rect width="90" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="45" y="19" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">[1..2]</text>
    <text x="45" y="35" font-size="10" fill="#94a3b8" text-anchor="middle">r=2 &lt; l=3 (剪枝)</text>
  </g>

  <!-- Level 2: [3,4] (Skipped & Subtract) -->
  <g transform="translate(310, 280)" filter="url(#shadow-skip)">
    <rect width="95" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <text x="47" y="19" font-size="12" font-weight="700" fill="#9a3412" text-anchor="middle">[3..4]</text>
    <text x="47" y="35" font-size="11" font-weight="600" fill="#c2410c" text-anchor="middle">和 5 &lt; rem(8)</text>
  </g>
  <!-- 跳过标签提示 -->
  <g transform="translate(275, 332)">
    <rect width="165" height="22" rx="4" fill="#ffedd5" stroke="#fdba74" stroke-width="1" />
    <text x="82" y="15" font-size="10" font-weight="600" fill="#c2410c" text-anchor="middle">整段跳过！rem 变为 8 - 5 = 3</text>
  </g>

  <!-- Level 2: [5,6] (Search Path) -->
  <g transform="translate(545, 280)" filter="url(#shadow-active)">
    <rect width="95" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="47" y="19" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">[5..6]</text>
    <text x="47" y="35" font-size="11" fill="#2563eb" text-anchor="middle">和 5 ≥ rem(3)</text>
  </g>

  <!-- Level 2: [7,8] (Unvisited) -->
  <g transform="translate(765, 280)" filter="url(#shadow)">
    <rect width="90" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="45" y="19" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">[7..8]</text>
    <text x="45" y="35" font-size="10" fill="#94a3b8" text-anchor="middle">无需访问 (剪枝)</text>
  </g>

  <!-- Level 3: Leaves -->
  <!-- [1,1] -->
  <g transform="translate(55, 375)">
    <rect width="70" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="35" y="17" font-size="11" fill="#94a3b8" text-anchor="middle">A[1]=2</text>
    <text x="35" y="30" font-size="9" fill="#cbd5e1" text-anchor="middle">未访问</text>
  </g>
  <!-- [2,2] -->
  <g transform="translate(165, 375)">
    <rect width="70" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="35" y="17" font-size="11" fill="#94a3b8" text-anchor="middle">A[2]=1</text>
    <text x="35" y="30" font-size="9" fill="#cbd5e1" text-anchor="middle">未访问</text>
  </g>

  <!-- [3,3] (Skipped) -->
  <g transform="translate(265, 375)">
    <rect width="70" height="38" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" stroke-dasharray="2,2" />
    <text x="35" y="17" font-size="11" fill="#ea580c" text-anchor="middle">A[3]=3</text>
    <text x="35" y="30" font-size="9" fill="#ea580c" text-anchor="middle">父树已跳过</text>
  </g>
  <!-- [4,4] (Skipped) -->
  <g transform="translate(375, 375)">
    <rect width="70" height="38" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" stroke-dasharray="2,2" />
    <text x="35" y="17" font-size="11" fill="#ea580c" text-anchor="middle">A[4]=2</text>
    <text x="35" y="30" font-size="9" fill="#ea580c" text-anchor="middle">父树已跳过</text>
  </g>

  <!-- [5,5] (TARGET!) -->
  <g transform="translate(485, 370)" filter="url(#shadow-target)">
    <rect width="90" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" />
    <text x="45" y="20" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">★ A[5] = 4</text>
    <text x="45" y="36" font-size="10" font-weight="700" fill="#16a34a" text-anchor="middle">4 ≥ rem(3) 命中!</text>
  </g>
  <!-- 目标命中高亮标签 -->
  <g transform="translate(460, 424)">
    <rect width="140" height="22" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
    <text x="70" y="15" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">命中目标！返回 r = 5</text>
  </g>

  <!-- [6,6] (Unvisited) -->
  <g transform="translate(605, 375)">
    <rect width="70" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="35" y="17" font-size="11" fill="#94a3b8" text-anchor="middle">A[6]=1</text>
    <text x="35" y="30" font-size="9" fill="#cbd5e1" text-anchor="middle">无需访问</text>
  </g>

  <!-- [7,7] & [8,8] (Unvisited) -->
  <g transform="translate(715, 375)">
    <rect width="70" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="35" y="17" font-size="11" fill="#94a3b8" text-anchor="middle">A[7]=5</text>
    <text x="35" y="30" font-size="9" fill="#cbd5e1" text-anchor="middle">无需访问</text>
  </g>
  <g transform="translate(825, 375)">
    <rect width="70" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="35" y="17" font-size="11" fill="#94a3b8" text-anchor="middle">A[8]=2</text>
    <text x="35" y="30" font-size="9" fill="#cbd5e1" text-anchor="middle">无需访问</text>
  </g>

  <!-- 底部流程时序卡片 -->
  <g transform="translate(20, 460)">
    <rect width="980" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="25" y="28" font-size="14" font-weight="700" fill="#0f172a">定位执行过程分解：</text>

    <!-- 卡片 1 -->
    <g transform="translate(25, 42)">
      <rect width="175" height="82" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" font-size="12" font-weight="700" fill="#0284c7">① 树根与左下界</text>
      <text x="12" y="40" font-size="11" fill="#475569">进入 [1..8]，ql=3 &gt; 1</text>
      <text x="12" y="56" font-size="11" fill="#475569">深入左子树 [1..4]</text>
      <text x="12" y="72" font-size="10" fill="#94a3b8">[1..2] 因 r&lt;3 直接剪枝</text>
    </g>

    <!-- 卡片 2 -->
    <g transform="translate(215, 42)">
      <rect width="185" height="82" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
      <text x="12" y="20" font-size="12" font-weight="700" fill="#c2410c">② 节点 [3..4] 整段跳过</text>
      <text x="12" y="40" font-size="11" fill="#9a3412">当前 rem = 8 ，段和 = 5</text>
      <text x="12" y="56" font-size="11" font-weight="700" fill="#ea580c">5 &lt; 8 ➜ 整段不足以达标！</text>
      <text x="12" y="72" font-size="11" fill="#9a3412">直接跳过子树，rem 变为 3</text>
    </g>

    <!-- 卡片 3 -->
    <g transform="translate(415, 42)">
      <rect width="180" height="82" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
      <text x="12" y="20" font-size="12" font-weight="700" fill="#1d4ed8">③ 转向右子树 [5..8]</text>
      <text x="12" y="40" font-size="11" fill="#1e40af">此时 rem = 3 ，段和 = 12</text>
      <text x="12" y="56" font-size="11" font-weight="700" fill="#2563eb">12 ≥ 3 ➜ 答案必在其中！</text>
      <text x="12" y="72" font-size="11" fill="#1e40af">优先深入左子树 [5..6]</text>
    </g>

    <!-- 卡片 4 -->
    <g transform="translate(610, 42)">
      <rect width="175" height="82" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
      <text x="12" y="20" font-size="12" font-weight="700" fill="#1d4ed8">④ 深入分支 [5..6]</text>
      <text x="12" y="40" font-size="11" fill="#1e40af">此时 rem = 3 ，段和 = 5</text>
      <text x="12" y="56" font-size="11" font-weight="700" fill="#2563eb">5 ≥ 3 ➜ 左侧足够达标！</text>
      <text x="12" y="72" font-size="11" fill="#1e40af">优先深入左叶子 [5..5]</text>
    </g>

    <!-- 卡片 5 -->
    <g transform="translate(800, 42)">
      <rect width="165" height="82" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
      <text x="12" y="20" font-size="12" font-weight="700" fill="#15803d">⑤ 叶子命中答案！</text>
      <text x="12" y="40" font-size="11" fill="#166534">到达叶子 [5..5]，A[5]=4</text>
      <text x="12" y="56" font-size="11" font-weight="700" fill="#16a34a">4 ≥ 3 ➜ 命中目标！</text>
      <text x="12" y="72" font-size="11" font-weight="700" fill="#15803d">返回 r = 5，耗时 O(log N)</text>
    </g>
  </g>
</svg>