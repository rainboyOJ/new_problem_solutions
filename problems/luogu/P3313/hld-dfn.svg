<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">样例树的树链剖分</text>
  <text x="24" y="52" font-size="12" fill="#475569">蓝色粗线＝重儿子边（重链），灰色虚线＝轻边</text>
  <line x1="170" y1="110" x2="70" y2="245" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round"/>
  <line x1="262" y1="245" x2="338" y2="380" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round"/>
  <line x1="170" y1="110" x2="262" y2="245" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <line x1="262" y1="245" x2="200" y2="380" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <g>
    <rect x="116.0" y="82.0" width="108" height="56" rx="12"
          fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="170" y="104.0" text-anchor="middle" font-size="18"
          font-weight="700" fill="#0f172a">点 1</text>
    <text x="170" y="126.0" text-anchor="middle" font-size="13"
          fill="#1e40af">dfn 1</text>
  </g>
  <g>
    <rect x="16.0" y="217.0" width="108" height="56" rx="12"
          fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="70" y="239.0" text-anchor="middle" font-size="18"
          font-weight="700" fill="#0f172a">点 2</text>
    <text x="70" y="261.0" text-anchor="middle" font-size="13"
          fill="#166534">dfn 5</text>
  </g>
  <g>
    <rect x="208.0" y="217.0" width="108" height="56" rx="12"
          fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="262" y="239.0" text-anchor="middle" font-size="18"
          font-weight="700" fill="#0f172a">点 3</text>
    <text x="262" y="261.0" text-anchor="middle" font-size="13"
          fill="#1e40af">dfn 2</text>
  </g>
  <g>
    <rect x="146.0" y="352.0" width="108" height="56" rx="12"
          fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="200" y="374.0" text-anchor="middle" font-size="18"
          font-weight="700" fill="#0f172a">点 4</text>
    <text x="200" y="396.0" text-anchor="middle" font-size="13"
          fill="#1e40af">dfn 3</text>
  </g>
  <g>
    <rect x="284.0" y="352.0" width="108" height="56" rx="12"
          fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="338" y="374.0" text-anchor="middle" font-size="18"
          font-weight="700" fill="#0f172a">点 5</text>
    <text x="338" y="396.0" text-anchor="middle" font-size="13"
          fill="#9a3412">dfn 4</text>
  </g>
  <text x="470" y="30" font-size="16" font-weight="700" fill="#0f172a">按 dfn 重编号后的数组</text>
  <text x="470" y="52" font-size="12" fill="#475569">同一条重链在 dfn 上是连续的一段</text>
  <g><rect x="470" y="90" width="74" height="62" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="507.0" y="114" text-anchor="middle" font-size="12" fill="#1e40af">dfn 1</text>
    <text x="507.0" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">点 1</text></g>
  <g><rect x="544" y="90" width="74" height="62" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="581.0" y="114" text-anchor="middle" font-size="12" fill="#1e40af">dfn 2</text>
    <text x="581.0" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">点 3</text></g>
  <g><rect x="618" y="90" width="74" height="62" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="655.0" y="114" text-anchor="middle" font-size="12" fill="#1e40af">dfn 3</text>
    <text x="655.0" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">点 4</text></g>
  <g><rect x="692" y="90" width="74" height="62" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <text x="729.0" y="114" text-anchor="middle" font-size="12" fill="#9a3412">dfn 4</text>
    <text x="729.0" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">点 5</text></g>
  <g><rect x="766" y="90" width="74" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="803.0" y="114" text-anchor="middle" font-size="12" fill="#166534">dfn 5</text>
    <text x="803.0" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">点 2</text></g>
  <g>
    <path d="M 472 160 v 10 H 690 v -10" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <text x="581.0" y="190" text-anchor="middle" font-size="13"
          font-weight="600" fill="#1d4ed8">重链 1→3→4：连续占据 dfn 1..3</text>
  </g>
  <g>
    <path d="M 694 160 v 10 H 764 v -10" fill="none" stroke="#c2410c" stroke-width="2"/>
    <text x="729.0" y="190" text-anchor="middle" font-size="13"
          font-weight="600" fill="#c2410c">单点链 5</text>
  </g>
  <g>
    <path d="M 768 160 v 10 H 838 v -10" fill="none" stroke="#15803d" stroke-width="2"/>
    <text x="803.0" y="190" text-anchor="middle" font-size="13"
          font-weight="600" fill="#15803d">单点链 2</text>
  </g>
  <text x="470" y="282" font-size="12" fill="#334155">查询 5→1：先取 5 所在的单点链 dfn [4,4]，</text>
  <text x="470" y="302" font-size="12" fill="#334155">再取剩下的 3→1，得到 dfn [1,2]。两段都连续。</text>
</svg>
