<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- 直径 D 底色 -->
  <line x1="60" y1="150" x2="420" y2="150" stroke="#cbd5e1" stroke-width="2"/>
  <!-- dist(u,A) 与 dist(u,B) 两段 -->
  <line x1="60" y1="150" x2="240" y2="150" stroke="#d97706" stroke-width="4"/>
  <line x1="240" y1="150" x2="420" y2="150" stroke="#2563eb" stroke-width="4"/>
  <!-- 分支 v-u -->
  <line x1="240" y1="70" x2="240" y2="150" stroke="#16a34a" stroke-width="3"/>
  <!-- 路径 v → u → B（虚线，用于反证） -->
  <polyline points="240,70 240,150 420,150" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4" stroke-linejoin="round"/>
  <!-- 距离箭头 -->
  <line x1="64" y1="170" x2="236" y2="170" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="244" y1="170" x2="416" y2="170" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <!-- 节点 -->
  <circle cx="240" cy="70" r="6" fill="#16a34a"/>
  <circle cx="240" cy="150" r="6" fill="#dc2626"/>
  <circle cx="60" cy="150" r="6" fill="#d97706"/>
  <circle cx="420" cy="150" r="6" fill="#2563eb"/>
  <!-- 节点标签（加粗 + 白描边保证可见） -->
  <text x="240" y="44" text-anchor="middle" font-size="16" font-weight="bold" font-family="sans-serif" stroke="#ffffff" stroke-width="4" paint-order="stroke" fill="#16a34a">v</text>
  <text x="252" y="142" text-anchor="start" font-size="16" font-weight="bold" font-family="sans-serif" stroke="#ffffff" stroke-width="4" paint-order="stroke" fill="#dc2626">u</text>
  <text x="46" y="154" text-anchor="middle" font-size="13" font-family="sans-serif" stroke="#ffffff" stroke-width="3" paint-order="stroke" fill="#64748b">A</text>
  <text x="434" y="154" text-anchor="middle" font-size="13" font-family="sans-serif" stroke="#ffffff" stroke-width="3" paint-order="stroke" fill="#64748b">B</text>
  <!-- 距离标签 -->
  <text x="252" y="112" text-anchor="start" font-size="13" font-family="sans-serif" stroke="#ffffff" stroke-width="3" paint-order="stroke" fill="#16a34a">h</text>
  <text x="150" y="190" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#475569">dist(u,A)</text>
  <text x="330" y="190" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#475569">dist(u,B)</text>
</svg>
