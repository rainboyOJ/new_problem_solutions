<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" role="img" aria-labelledby="title desc">
<title id="title">路径与子树在 dfn 数组上的区间</title>
<desc id="desc">路径 1 到 3 拆成位置 4 和位置 2 两段；子树 4 是位置 5 单点；子树 1 是位置 2 到 5。</desc>
<rect x="118" y="48" width="76" height="62" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="156.0" y="75" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="20" font-weight="600" fill="#111827">2</text>
<text x="156.0" y="97" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="13" fill="#64748b">位置 1</text>
<rect x="204" y="48" width="76" height="62" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="242.0" y="75" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="20" font-weight="600" fill="#111827">1</text>
<text x="242.0" y="97" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="13" fill="#64748b">位置 2</text>
<rect x="290" y="48" width="76" height="62" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="328.0" y="75" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="20" font-weight="600" fill="#111827">5</text>
<text x="328.0" y="97" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="13" fill="#64748b">位置 3</text>
<rect x="376" y="48" width="76" height="62" rx="10" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
<text x="414.0" y="75" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="20" font-weight="600" fill="#111827">3</text>
<text x="414.0" y="97" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="13" fill="#64748b">位置 4</text>
<rect x="462" y="48" width="76" height="62" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="2"/>
<text x="500.0" y="75" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="20" font-weight="600" fill="#111827">4</text>
<text x="500.0" y="97" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="13" fill="#64748b">位置 5</text>
<text x="12" y="86" text-anchor="start" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="14" fill="#64748b">dfn 数组</text>
<text x="12" y="182" text-anchor="start" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="15" font-weight="600" fill="#111827">路径 1 → 3</text>
<rect x="208" y="164" width="68" height="28" rx="8" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="2"/>
<text x="242.0" y="183" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="14" font-weight="600" fill="#2563eb">[2,2]</text>
<rect x="380" y="164" width="68" height="28" rx="8" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="2"/>
<text x="414.0" y="183" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="14" font-weight="600" fill="#2563eb">[4,4]</text>
<path d="M500.0 196 C 500.0 220, 242.0 220, 242.0 198" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
<text x="371.0" y="234" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="12" fill="#64748b">跨一条轻边，跳到链头的父亲</text>
<text x="12" y="248" text-anchor="start" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="13" fill="#64748b">两段分两次区间操作：先处理 [4,4]（点 3 所在的那条链），</text>
<text x="12" y="267" text-anchor="start" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="13" fill="#64748b">再跳到链头父亲处理 [2,2]（点 1），路径才闭合。</text>
<text x="12" y="312" text-anchor="start" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="15" font-weight="600" fill="#111827">子树 4</text>
<rect x="466" y="294" width="68" height="28" rx="8" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="2"/>
<text x="500.0" y="313" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="14" font-weight="600" fill="#2563eb">[5,5]</text>
<text x="12" y="348" text-anchor="start" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="13" fill="#64748b">[dfn[4], dfn[4]+sz[4]-1] = [5,5]，一次区间操作。</text>
<text x="12" y="442" text-anchor="start" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="15" font-weight="600" fill="#111827">子树 1</text>
<rect x="208" y="424" width="326" height="28" rx="8" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="2"/>
<text x="371.0" y="443" text-anchor="middle" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="14" font-weight="600" fill="#2563eb">[2,5]</text>
<text x="12" y="478" text-anchor="start" font-family="system-ui, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="13" fill="#64748b">[dfn[1], dfn[1]+sz[1]-1] = [2,5]，一次区间操作覆盖整棵子树。</text>
</svg>
