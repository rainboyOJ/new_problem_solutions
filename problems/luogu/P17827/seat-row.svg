<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc">
  <title id="title">一排座位被过道切成两段，以及两种编号方式的差别</title>
  <desc id="desc">A B C 在过道左侧，D F 在右侧。按侧编号时左侧是 0 1 2、右侧是 0 1，C 与 D 分属两侧不相邻；若统一编号成 0 1 2 3 4，C 与 D 只差 1，会被错误地判成相邻。</desc>
  <rect width="820" height="440" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="600" font-family="sans-serif" fill="#0f172a">一节二等座车厢的一排：过道把 5 个座位切成两段</text>
  <text x="270" y="76" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#1d4ed8">过道左侧　side = 0</text>
  <text x="640" y="76" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#1d4ed8">过道右侧　side = 1</text>
  <line x1="114" y1="84" x2="426" y2="84" stroke="#93c5fd" stroke-width="2"/>
  <line x1="544" y1="84" x2="736" y2="84" stroke="#93c5fd" stroke-width="2"/>
  <rect x="114" y="96" width="72" height="64" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="150" y="140" text-anchor="middle" font-size="30" font-weight="600" fill="#1e3a8a">A</text>
  <rect x="234" y="96" width="72" height="64" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="270" y="140" text-anchor="middle" font-size="30" font-weight="600" fill="#1e3a8a">B</text>
  <rect x="354" y="96" width="72" height="64" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="390" y="140" text-anchor="middle" font-size="30" font-weight="600" fill="#1e3a8a">C</text>
  <rect x="544" y="96" width="72" height="64" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="580" y="140" text-anchor="middle" font-size="30" font-weight="600" fill="#1e3a8a">D</text>
  <rect x="664" y="96" width="72" height="64" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="700" y="140" text-anchor="middle" font-size="30" font-weight="600" fill="#1e3a8a">F</text>
  <line x1="485" y1="88" x2="485" y2="168" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7,6"/>
  <text x="485" y="190" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#64748b">过道</text>
  <line x1="190" y1="128" x2="230" y2="128" stroke="#16a34a" stroke-width="3"/>
  <text x="210" y="114" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#15803d">相邻</text>
  <line x1="310" y1="128" x2="350" y2="128" stroke="#16a34a" stroke-width="3"/>
  <text x="330" y="114" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#15803d">相邻</text>
  <line x1="620" y1="128" x2="660" y2="128" stroke="#16a34a" stroke-width="3"/>
  <text x="640" y="114" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#15803d">相邻</text>
  <line x1="430" y1="128" x2="477" y2="128" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="493" y1="128" x2="540" y2="128" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="485" y="114" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#b91c1c">✗ 不算相邻</text>
  <text x="24" y="214" font-size="13" font-family="sans-serif" fill="#1d4ed8">按侧编号 p</text>
  <text x="24" y="258" font-size="13" font-family="sans-serif" fill="#64748b">统一编号</text>
  <text x="150" y="214" text-anchor="middle" font-size="17" font-family="sans-serif" font-weight="600" fill="#1d4ed8">0</text>
  <text x="150" y="258" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#94a3b8">0</text>
  <text x="270" y="214" text-anchor="middle" font-size="17" font-family="sans-serif" font-weight="600" fill="#1d4ed8">1</text>
  <text x="270" y="258" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#94a3b8">1</text>
  <text x="390" y="214" text-anchor="middle" font-size="17" font-family="sans-serif" font-weight="600" fill="#1d4ed8">2</text>
  <text x="390" y="258" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#94a3b8">2</text>
  <text x="580" y="214" text-anchor="middle" font-size="17" font-family="sans-serif" font-weight="600" fill="#1d4ed8">0</text>
  <text x="580" y="258" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#dc2626">3</text>
  <text x="700" y="214" text-anchor="middle" font-size="17" font-family="sans-serif" font-weight="600" fill="#1d4ed8">1</text>
  <text x="700" y="258" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#94a3b8">4</text>
  <g font-family="sans-serif" font-size="14" fill="#334155">
    <text x="60" y="316">按侧编号：左侧 A B C 是 0 1 2，右侧 D F 是 0 1，同侧差 1 才是相邻。</text>
    <text x="60" y="344" fill="#b91c1c">统一编号：C 是 2、D 是 3，差 1 却隔着过道，样例 #3 的 01C 与 01D 会因此被误判成相邻。</text>
    <text x="60" y="378">所以判相邻要带两个数：side 回答在哪一侧，p 回答在这一侧从左数第几个。</text>
    <text x="60" y="406">四个答案也是这个顺序：同车厢 → 同排 → 同排同侧 → 同侧相邻，后一条都以前一条为前提。</text>
  </g>
</svg>
