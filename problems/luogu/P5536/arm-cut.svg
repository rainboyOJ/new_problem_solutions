<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="332" viewBox="0 0 780 332" role="img" aria-labelledby="title desc">
  <title id="title">删掉 u 后核心只能占一条臂</title>
  <desc id="desc">点 u 有两条长度至少为 r 的臂，连通核心 C 不含 u 时只能整体落在其中一条臂的方向里，于是另一条臂上距离 r 的点 w 到核心的距离至少是 r+1。</desc>
  <defs>
    <marker id="arm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="780" height="332" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="17" font-weight="600" font-family="sans-serif" fill="#0f172a">删掉 u 后，连通的 C 只能整体落在一条臂里</text>

  <line x1="390" y1="170" x2="120" y2="170" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <line x1="390" y1="170" x2="600" y2="170" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <line x1="390" y1="170" x2="390" y2="258" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <rect x="600" y="102" width="152" height="136" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="676" y="126" text-anchor="middle" font-size="15" font-weight="600" font-family="sans-serif" fill="#b91c1c">连通核心 C</text>
  <line x1="600" y1="170" x2="635" y2="170" stroke="#dc2626" stroke-width="3"/>
  <line x1="635" y1="170" x2="672" y2="152" stroke="#dc2626" stroke-width="3"/>
  <line x1="635" y1="170" x2="664" y2="202" stroke="#dc2626" stroke-width="3"/>
  <line x1="672" y1="152" x2="716" y2="146" stroke="#dc2626" stroke-width="3"/>
  <circle cx="635" cy="170" r="7" fill="#dc2626"/>
  <circle cx="672" cy="152" r="7" fill="#dc2626"/>
  <circle cx="664" cy="202" r="7" fill="#dc2626"/>
  <circle cx="716" cy="146" r="7" fill="#dc2626"/>

  <circle cx="120" cy="170" r="9" fill="#16a34a"/>
  <circle cx="120" cy="170" r="17" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,4"/>

  <circle cx="390" cy="170" r="12" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <g font-family="sans-serif" font-weight="700" fill="#0f172a" font-size="17">
    <text x="390" y="142" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">u</text>
    <text x="120" y="142" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke">w</text>
  </g>

  <line x1="130" y1="204" x2="382" y2="204" stroke="#334155" stroke-width="1.5" marker-start="url(#arm-arrow)" marker-end="url(#arm-arrow)"/>
  <text x="256" y="228" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#334155">dist(w,u) = r，这一侧没有核心点</text>
  <line x1="398" y1="204" x2="592" y2="204" stroke="#334155" stroke-width="1.5" marker-start="url(#arm-arrow)" marker-end="url(#arm-arrow)"/>
  <text x="495" y="228" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#334155">d(u,C) ≥ 1</text>
  <text x="390" y="284" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#64748b">（u 的第三个方向，与本步结论无关）</text>
  <text x="390" y="316" text-anchor="middle" font-size="15" font-weight="600" font-family="sans-serif" fill="#0f172a">d(w,C) = dist(w,u) + d(u,C) = r + d(u,C) ≥ r + 1</text>
</svg>
