<line x1="212.0" y1="536" x2="548.0" y2="536" stroke="#e2e8f0" stroke-width="1" stroke-opacity="1"/>
<text x="212.0" y="560" font-size="11" fill="#94a3b8" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="normal">1</text>
<text x="192.0" y="536" font-size="11" fill="#94a3b8" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="normal">1</text>
<line x1="254.0" y1="536" x2="254.0" y2="200" stroke="#e2e8f0" stroke-width="1" stroke-opacity="1"/>
<line x1="212.0" y1="494" x2="548.0" y2="494" stroke="#e2e8f0" stroke-width="1" stroke-opacity="1"/>
<text x="254.0" y="560" font-size="11" fill="#94a3b8" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2</text>
<text x="192.0" y="494" font-size="11" fill="#94a3b8" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2</text>
<line x1="296.0" y1="536" x2="296.0" y2="200" stroke="#e2e8f0" stroke-width="1" stroke-opacity="1"/>
<line x1="212.0" y1="452" x2="548.0" y2="452" stroke="#e2e8f0" stroke-width="1" stroke-opacity="1"/>
<text x="296.0" y="560" font-size="11" fill="#94a3b8" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="normal">3</text>
<text x="192.0" y="452" font-size="11" fill="#94a3b8" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="normal">3</text>
