<svg xmlns="http://www.w3.org/2000/svg" width="760" height="686" viewBox="0 0 760 686" font-family="'Noto Sans CJK SC','Source Han Sans SC','Helvetica Neue',Arial,sans-serif">
<rect x="0" y="0" width="760" height="686" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<text x="24" y="28" font-size="15" fill="#334155" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="bold">把节点画成平面点 (dfn, rdfn)：查询 v=6 时哪些点是它的祖先？</text>
<text x="24" y="52" font-size="12" fill="#64748b" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="normal">本例把 5 和 8 染黑，然后查询 1 6（根到 6 的路径上最浅的黑点）</text>
<circle cx="34" cy="82" r="8" fill="#16a34a" stroke="#14532d" stroke-width="1.8"/>
<text x="50" y="83" font-size="11.5" fill="#15803d" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="normal">答案：框内 dfn 最小的黑点</text>
<circle cx="34" cy="105" r="8" fill="#fecaca" stroke="#b91c1c" stroke-width="1.8"/>
<text x="50" y="106" font-size="11.5" fill="#b91c1c" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="normal">黑点但落在框外（不是 6 的祖先）</text>
<circle cx="34" cy="128" r="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="50" y="129" font-size="11.5" fill="#1d4ed8" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="normal">框内的白点（是 6 的祖先，但没染黑）</text>
<circle cx="34" cy="151" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="50" y="152" font-size="11.5" fill="#94a3b8" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="normal">既不是黑点、也不在框内</text>
