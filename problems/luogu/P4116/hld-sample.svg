<text x="300" y="216" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 2</text>
<circle cx="600" cy="182" r="21" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="600" y="183" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="600" y="216" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 9</text>
<circle cx="190" cy="272" r="21" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="190" y="273" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">4</text>
<text x="190" y="306" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 8</text>
