<text x="390" y="306" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 3</text>
<circle cx="280" cy="362" r="21" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="280" y="363" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">5</text>
<text x="280" y="396" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 6</text>
<circle cx="390" cy="362" r="21" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="390" y="363" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">7</text>
<text x="390" y="396" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 7</text>
<circle cx="505" cy="362" r="21" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
<text x="505" y="363" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle">8</text>
<text x="505" y="396" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 4</text>
<circle cx="505" cy="446" r="21" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="505" y="447" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">6</text>
<text x="505" y="480" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 5</text>
<text x="626" y="168" font-size="11" fill="#c2410c" dominant-baseline="middle">链头 3</text>
<text x="216" y="258" font-size="11" fill="#c2410c" dominant-baseline="middle">链头 4</text>
<text x="306" y="348" font-size="11" fill="#c2410c" dominant-baseline="middle">链头 5</text>
<text x="416" y="348" font-size="11" fill="#c2410c" dominant-baseline="middle">链头 7</text>
<text x="20" y="500" font-size="14" fill="#334155" font-weight="bold" dominant-baseline="middle">dfn 数组：同一条重链占连续一段下标，链内下标随深度递增</text>
<text x="202.0" y="534" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">1</text>
<text x="264.0" y="534" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">2</text>
<text x="326.0" y="534" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="388.0" y="534" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">4</text>
<text x="450.0" y="534" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">5</text>
<text x="512.0" y="534" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">6</text>
<text x="574.0" y="534" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">7</text>
<text x="636.0" y="534" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">8</text>
<text x="698.0" y="534" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">9</text>
<rect x="171" y="546" width="62" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="202.0" y="570.0" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1</text>
<rect x="233" y="546" width="62" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="264.0" y="570.0" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">2</text>
<rect x="295" y="546" width="62" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="326.0" y="570.0" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">9</text>
<rect x="357" y="546" width="62" height="46" fill="#1f2937" stroke="#1f2937" stroke-width="1.4"/>
<text x="388.0" y="570.0" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle">8</text>
<rect x="419" y="546" width="62" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="450.0" y="570.0" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">6</text>
<rect x="481" y="546" width="62" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="512.0" y="570.0" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">5</text>
<rect x="543" y="546" width="62" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="574.0" y="570.0" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">7</text>
<rect x="605" y="546" width="62" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="636.0" y="570.0" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">4</text>
<rect x="667" y="546" width="62" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="698.0" y="570.0" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="159" y="570.0" font-size="12" fill="#334155" text-anchor="end" dominant-baseline="middle">节点</text>
<rect x="166" y="541" width="320" height="56" rx="8" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="499" y="560.0" font-size="12" fill="#1d4ed8" dominant-baseline="middle">查询 1→6</text>
<text x="499" y="578.0" font-size="12" fill="#1d4ed8" dominant-baseline="middle">区间 [1, 5]</text>
<path d="M 171 608 L 171 616 L 481 616 L 481 608" fill="none" stroke="#b91c1c" stroke-width="2"/>
<text x="326.0" y="633" font-size="12" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle">链 1（链头 1）：dfn 1..5 = 节点 1 → 2 → 9 → 8 → 6</text>
<path d="M 497.0 608 L 497.0 616 L 527.0 616 L 527.0 608" fill="none" stroke="#c2410c" stroke-width="2"/>
<text x="512.0" y="633" font-size="12" fill="#c2410c" text-anchor="middle" dominant-baseline="middle">链 5</text>
<path d="M 559.0 608 L 559.0 616 L 589.0 616 L 589.0 608" fill="none" stroke="#c2410c" stroke-width="2"/>
<text x="574.0" y="633" font-size="12" fill="#c2410c" text-anchor="middle" dominant-baseline="middle">链 7</text>
<path d="M 621.0 608 L 621.0 616 L 651.0 616 L 651.0 608" fill="none" stroke="#c2410c" stroke-width="2"/>
<text x="636.0" y="633" font-size="12" fill="#c2410c" text-anchor="middle" dominant-baseline="middle">链 4</text>
<path d="M 683.0 608 L 683.0 616 L 713.0 616 L 713.0 608" fill="none" stroke="#c2410c" stroke-width="2"/>
<text x="698.0" y="633" font-size="12" fill="#c2410c" text-anchor="middle" dominant-baseline="middle">链 3</text>
<text x="20" y="678" font-size="12.5" fill="#b91c1c" dominant-baseline="middle">① 查询 1→6：路径只落在链 1，区间 [1, 5] 内最小黑点 dfn = 4，反查得节点 8。</text>
<text x="20" y="704" font-size="12.5" fill="#334155" dominant-baseline="middle">② 查询 1→7：链 7 为空；链 1 区间 [1, 3] 内最小黑点 dfn = 4 > 3，</text>
<text x="20" y="730" font-size="12.5" fill="#334155" dominant-baseline="middle">      说明黑点 8 在 7 的下方而不是祖先，所以输出 -1。</text>
</svg>
