<svg xmlns="http://www.w3.org/2000/svg" width="980" height="820" viewBox="0 0 980 820" font-family="'Noto Sans CJK SC','Source Han Sans SC','Helvetica Neue',Arial,sans-serif">
<rect x="0" y="0" width="980" height="820" fill="#ffffff"/>
<text x="20" y="30" font-size="16" fill="#334155" font-weight="bold" dominant-baseline="middle">样例树：重链剖分后，每条重链内的 dfn 随深度递增</text>
<line x1="20" y1="58" x2="58" y2="58" stroke="#b91c1c" stroke-width="4"/>
<text x="66" y="59" font-size="12" fill="#334155" dominant-baseline="middle">重边（连向重儿子）</text>
<line x1="226" y1="58" x2="264" y2="58" stroke="#94a3b8" stroke-width="1.8"/>
<text x="272" y="59" font-size="12" fill="#334155" dominant-baseline="middle">轻边</text>
<circle cx="352" cy="58" r="10" fill="#1f2937"/>
<text x="368" y="59" font-size="12" fill="#334155" dominant-baseline="middle">黑点（已执行 0 8）</text>
<text x="20" y="80" font-size="12" fill="#94a3b8" dominant-baseline="middle">圆内是原编号，圆下方小字是 dfn；橙色标注的是各条轻链的链头</text>
<line x1="440" y1="96" x2="300" y2="182" stroke="#b91c1c" stroke-width="4"/>
<line x1="440" y1="96" x2="600" y2="182" stroke="#94a3b8" stroke-width="1.8"/>
