<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">样例1：原mex与链划分贡献</title>
<desc id="desc">实线选择1到2到4为一条链，3与5单独成链。各点模型贡献1、2、1、3、2，总和9；原mex为4、3、1、1、0，总和也是9。</desc>
<rect width="960" height="470" fill="#fff"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#172033">
<text x="24" y="34" font-size="25" text-anchor="start" fill="#172033">同一份最优方案，两种贡献的记账方式</text>
<text x="24" y="63" font-size="17" text-anchor="start" fill="#172033">绿色实线为延续边；虚线处另开一条链。</text>
<line x1="230" y1="110" x2="145" y2="220" stroke="#087e5a" stroke-width="5"/>
<line x1="230" y1="110" x2="360" y2="220" stroke="#8b98aa" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="145" y1="220" x2="75" y2="340" stroke="#087e5a" stroke-width="5"/>
<line x1="145" y1="220" x2="235" y2="340" stroke="#8b98aa" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="230" cy="110" r="25" fill="#f1faf6" stroke="#087e5a" stroke-width="2"/>
<text x="230" y="117" font-size="21" text-anchor="middle" fill="#172033">1</text>
<text x="230" y="158" font-size="15" text-anchor="middle" fill="#172033">a=3，mex=4</text>
<circle cx="145" cy="220" r="25" fill="#f1faf6" stroke="#087e5a" stroke-width="2"/>
<text x="145" y="227" font-size="21" text-anchor="middle" fill="#172033">2</text>
<text x="145" y="268" font-size="15" text-anchor="middle" fill="#172033">a=2，mex=3</text>
<circle cx="360" cy="220" r="25" fill="#f1faf6" stroke="#087e5a" stroke-width="2"/>
<text x="360" y="227" font-size="21" text-anchor="middle" fill="#172033">3</text>
<text x="360" y="268" font-size="15" text-anchor="middle" fill="#172033">a=0，mex=1</text>
<circle cx="75" cy="340" r="25" fill="#f1faf6" stroke="#087e5a" stroke-width="2"/>
<text x="75" y="347" font-size="21" text-anchor="middle" fill="#172033">4</text>
<text x="75" y="388" font-size="15" text-anchor="middle" fill="#172033">a=0，mex=1</text>
<circle cx="235" cy="340" r="25" fill="#f1faf6" stroke="#087e5a" stroke-width="2"/>
<text x="235" y="347" font-size="21" text-anchor="middle" fill="#172033">5</text>
<text x="235" y="388" font-size="15" text-anchor="middle" fill="#172033">a=1，mex=0</text>
<text x="485" y="107" font-size="18" text-anchor="start" fill="#172033">节点</text>
<text x="590" y="107" font-size="18" text-anchor="start" fill="#172033">原子树 mex</text>
<text x="770" y="107" font-size="18" text-anchor="start" fill="#172033">模型贡献</text>
<text x="505" y="147" font-size="18" text-anchor="start" fill="#172033">1</text>
<text x="630" y="147" font-size="18" text-anchor="start" fill="#172033">4</text>
<text x="805" y="147" font-size="18" text-anchor="start" fill="#172033">1</text>
<text x="505" y="182" font-size="18" text-anchor="start" fill="#172033">2</text>
<text x="630" y="182" font-size="18" text-anchor="start" fill="#172033">3</text>
<text x="805" y="182" font-size="18" text-anchor="start" fill="#172033">2</text>
<text x="505" y="217" font-size="18" text-anchor="start" fill="#172033">3</text>
<text x="630" y="217" font-size="18" text-anchor="start" fill="#172033">1</text>
<text x="805" y="217" font-size="18" text-anchor="start" fill="#172033">1</text>
<text x="505" y="252" font-size="18" text-anchor="start" fill="#172033">4</text>
<text x="630" y="252" font-size="18" text-anchor="start" fill="#172033">1</text>
<text x="805" y="252" font-size="18" text-anchor="start" fill="#172033">3</text>
<text x="505" y="287" font-size="18" text-anchor="start" fill="#172033">5</text>
<text x="630" y="287" font-size="18" text-anchor="start" fill="#172033">0</text>
<text x="805" y="287" font-size="18" text-anchor="start" fill="#172033">2</text>
<text x="485" y="335" font-size="19" text-anchor="start" fill="#172033">原价值：4+3+1+1+0=9</text>
<text x="485" y="367" font-size="19" text-anchor="start" fill="#172033">模型值：1+2+1+3+2=9</text>
<text x="25" y="432" font-size="18" text-anchor="start" fill="#172033">例如节点5：根路径分为 [1—2] 和 [5]，最长链段有2个点，模型贡献为2。</text>
</g></svg>