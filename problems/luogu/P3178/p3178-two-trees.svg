<svg xmlns="http://www.w3.org/2000/svg" width="980" height="736" viewBox="0 0 980 736" role="img" aria-labelledby="t d">
<title id="t">常数树与系数树在样例树上的逐步演化</title>
<desc id="d">六个面板都画同一棵样例树，节点圈里下行两个数依次是常数与系数。黄圈表示这一步常数变了，蓝圈表示这一步系数变了，绿框是查询取的节点。三次查询依次得到 6、9、13。</desc>
<rect width="980" height="736" fill="#ffffff"/>
<text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">样例树上的逐步演化：节点圈内下行是「常数 / 系数」</text>
<text x="20" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">常数 = 该点到根这段攒下的常数贡献；系数 = 待乘深度的累计系数；答案 = 常数 + dep × 系数</text>
<text x="20" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">黄圈 = 这一步常数变了　蓝圈 = 这一步系数变了　绿框 = 这次查询取的节点</text>
