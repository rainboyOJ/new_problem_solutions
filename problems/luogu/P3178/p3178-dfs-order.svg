<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="t d">
<title id="t">样例树的 DFS 序与子树区间</title>
<desc id="d">左图是样例树，每个节点标出 dfn_in 与 dep；节点 2 的子树 {2,3,5} 在 DFS 序上正好占住第 2 到第 4 个位置。右图把 DFS 序摊成数组，上面一行是节点号，下面一行是深度；两段括号标出子树 2 与子树 1 的连续区间。</desc>
