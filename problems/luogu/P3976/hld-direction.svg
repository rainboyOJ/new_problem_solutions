<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="780" viewBox="0 0 1020 780" font-family="'Noto Sans CJK SC','Source Han Sans SC','Helvetica Neue',Arial,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker></defs>
<rect x="0" y="0" width="1020" height="780" fill="#ffffff"/>
<text x="20" y="28" font-size="16" fill="#334155" font-weight="bold" dominant-baseline="middle">同一棵树上，dfn 增序与旅行方向可以相反</text>
<line x1="20" y1="54" x2="56" y2="54" stroke="#b91c1c" stroke-width="4"/>
<text x="64" y="55" font-size="12" fill="#334155" dominant-baseline="middle">重边</text>
<line x1="112" y1="54" x2="148" y2="54" stroke="#94a3b8" stroke-width="1.8"/>
<text x="156" y="55" font-size="12" fill="#334155" dominant-baseline="middle">轻边</text>
<line x1="206" y1="54" x2="242" y2="54" stroke="#1d4ed8" stroke-width="3.4" marker-end="url(#ar)"/>
<text x="250" y="55" font-size="12" fill="#334155" dominant-baseline="middle">旅行方向 5 → 3</text>
<text x="20" y="76" font-size="12" fill="#94a3b8" dominant-baseline="middle">圆内是原编号，圆下小字是 dfn，橙色小字是链头</text>
<line x1="240" y1="100" x2="160" y2="190" stroke="#b91c1c" stroke-width="4"/>
<line x1="240" y1="100" x2="380" y2="190" stroke="#94a3b8" stroke-width="1.8"/>
<line x1="160" y1="190" x2="96" y2="280" stroke="#b91c1c" stroke-width="4"/>
<line x1="160" y1="190" x2="240" y2="280" stroke="#94a3b8" stroke-width="1.8"/>
<line x1="96" y1="280" x2="50" y2="370" stroke="#b91c1c" stroke-width="4"/>
<line x1="240" y1="280" x2="160" y2="190" stroke="#1d4ed8" stroke-width="3.2" stroke-opacity="0.85" marker-end="url(#ar)"/>
<line x1="160" y1="190" x2="240" y2="100" stroke="#1d4ed8" stroke-width="3.2" stroke-opacity="0.85" marker-end="url(#ar)"/>
<line x1="240" y1="100" x2="380" y2="190" stroke="#1d4ed8" stroke-width="3.2" stroke-opacity="0.85" marker-end="url(#ar)"/>
<circle cx="240" cy="100" r="20" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="240" y="101" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1</text>
<text x="240" y="131" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 1</text>
<circle cx="160" cy="190" r="20" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="160" y="191" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">2</text>
<text x="160" y="221" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 2</text>
<circle cx="380" cy="190" r="20" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="380" y="191" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="380" y="221" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 6</text>
<circle cx="96" cy="280" r="20" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="96" y="281" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">4</text>
<text x="96" y="311" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 3</text>
<circle cx="240" cy="280" r="20" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="240" y="281" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">5</text>
<text x="240" y="311" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 5</text>
<circle cx="50" cy="370" r="20" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="50" y="371" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">6</text>
<text x="50" y="401" font-size="11" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle">dfn 4</text>
<text x="380" y="236" font-size="11" fill="#c2410c" text-anchor="middle" dominant-baseline="middle">链头 3</text>
<text x="240" y="326" font-size="11" fill="#c2410c" text-anchor="middle" dominant-baseline="middle">链头 5</text>
<text x="212" y="280" font-size="13" fill="#1d4ed8" font-weight="bold" text-anchor="end" dominant-baseline="middle">a = 5</text>
<text x="406" y="162" font-size="13" fill="#1d4ed8" font-weight="bold" dominant-baseline="middle">b = 3</text>
<text x="470" y="104" font-size="13.5" fill="#334155" font-weight="bold" dominant-baseline="middle">dfn 数组：同一条重链占连续一段，链内 dfn 随深度递增</text>
<text x="500.0" y="162" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">dfn 1</text>
<text x="560.0" y="162" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">dfn 2</text>
<text x="620.0" y="162" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">dfn 3</text>
<text x="680.0" y="162" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">dfn 4</text>
<text x="740.0" y="162" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">dfn 5</text>
<text x="800.0" y="162" font-size="11" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">dfn 6</text>
<rect x="470" y="176" width="60" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="500.0" y="199.0" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1</text>
<rect x="530" y="176" width="60" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="560.0" y="199.0" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">2</text>
<rect x="590" y="176" width="60" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="620.0" y="199.0" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">4</text>
<rect x="650" y="176" width="60" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="680.0" y="199.0" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">6</text>
<rect x="710" y="176" width="60" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="740.0" y="199.0" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">5</text>
<rect x="770" y="176" width="60" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="800.0" y="199.0" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="460" y="199.0" font-size="12" fill="#334155" text-anchor="end" dominant-baseline="middle">节点</text>
<path d="M 470 236 L 470 244 L 710 244 L 710 236" fill="none" stroke="#b91c1c" stroke-width="2"/>
<text x="590.0" y="261" font-size="12" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle">链 1</text>
<path d="M 710 236 L 710 244 L 770 244 L 770 236" fill="none" stroke="#c2410c" stroke-width="2"/>
<text x="740.0" y="261" font-size="12" fill="#c2410c" text-anchor="middle" dominant-baseline="middle">链 5</text>
<path d="M 770 236 L 770 244 L 830 244 L 830 236" fill="none" stroke="#c2410c" stroke-width="2"/>
<text x="800.0" y="261" font-size="12" fill="#c2410c" text-anchor="middle" dominant-baseline="middle">链 3</text>
<rect x="705" y="170" width="70" height="56" rx="7" fill="none" stroke="#047857" stroke-width="2.4" stroke-dasharray="7 5"/>
<circle cx="718" cy="138" r="11" fill="#047857"/>
<text x="718" y="139" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle">①</text>
<rect x="465" y="170" width="130" height="56" rx="7" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-dasharray="7 5"/>
<circle cx="478" cy="138" r="11" fill="#b91c1c"/>
<text x="478" y="139" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle">②</text>
<rect x="765" y="170" width="70" height="56" rx="7" fill="none" stroke="#c2410c" stroke-width="2.4" stroke-dasharray="7 5"/>
<circle cx="778" cy="138" r="11" fill="#c2410c"/>
<text x="778" y="139" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle">③</text>
<text x="470" y="304" font-size="13.5" fill="#334155" font-weight="bold" dominant-baseline="middle">每段拿到手的 dfn 方向与真实旅行方向</text>
<circle cx="480" cy="336" r="11" fill="#047857"/>
<text x="480" y="337" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle">①</text>
<text x="498" y="336" font-size="12.5" fill="#334155" dominant-baseline="middle"><tspan font-weight="bold">链 5，区间 [5, 5]</tspan><tspan>：单点，方向无影响</tspan></text>
<circle cx="480" cy="366" r="11" fill="#b91c1c"/>
<text x="480" y="367" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle">②</text>
<text x="498" y="366" font-size="12.5" fill="#334155" dominant-baseline="middle"><tspan font-weight="bold">链 1，区间 [1, 2]</tspan><tspan>：dfn 增序是 1 → 2，旅行方向是 2 → 1</tspan></text>
<text x="498" y="396" font-size="12.5" fill="#b91c1c" dominant-baseline="middle">两者相反，所以这一段必须先翻转再加进来</text>
<circle cx="480" cy="426" r="11" fill="#c2410c"/>
<text x="480" y="427" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle">③</text>
<text x="498" y="426" font-size="12.5" fill="#334155" dominant-baseline="middle"><tspan font-weight="bold">链 3，区间 [6, 6]</tspan><tspan>：单点，方向无影响</tspan></text>
<rect x="462" y="452" width="530" height="126" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="478" y="474" font-size="13" fill="#1d4ed8" font-weight="bold" dominant-baseline="middle">两段拼起来才是整条路径的顺序</text>
<text x="478" y="502" font-size="12.5" fill="#334155" dominant-baseline="middle">a 侧：① = (5)　→　并入 ② 的翻转 (2, 1)　→　(5, 2, 1)</text>
<text x="478" y="528" font-size="12.5" fill="#334155" dominant-baseline="middle">b 侧：③ = (3)　→　整条路径 = (5, 2, 1, 3)</text>
<text x="478" y="556" font-size="12.5" fill="#b91c1c" dominant-baseline="middle">把 ② 放到 ① 前面，序列就变成 (2, 1, 5)：先买 2 后买 5，答案跟着错</text>
<text x="20" y="440" font-size="12.5" fill="#334155" dominant-baseline="middle">链 1 = 1 → 2 → 4 → 6，dfn 连续取到 1..4，且越深 dfn 越大。</text>
<text x="20" y="466" font-size="12.5" fill="#334155" dominant-baseline="middle">a = 5 挂在链 1 的节点 2 下面，所以 a 侧先取链 5 的一段（①），</text>
<text x="20" y="492" font-size="12.5" fill="#334155" dominant-baseline="middle">再取链 1 的一段（②）。这两段合起来就是 a 侧跨两条重链的情形。</text>
<text x="20" y="518" font-size="12.5" fill="#334155" dominant-baseline="middle">b = 3 是根 1 的轻儿子，自成一条链（③），这一段 dfn 增序就是旅行方向。</text>
</svg>
