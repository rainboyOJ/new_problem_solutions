<script type="application/json" id="source-data">{"hash": "4af0a9f2d3be9beab0d5c41c7ea33aa1887b62182276828998ab2aa2c4644162", "blocks": {"process_query": {"line": 306, "text": "void process_query(int id, const string &a, const string &b) {\n    // 替换不改变长度\n    if (a.size() != b.size()) {\n        answer[id] = 0;\n        return;\n    }\n\n    int len = a.size();\n    // first_diff / last_diff 即询问两串的差异区间 [L, R]\n    int first_diff = -1;\n    int last_diff = -1;\n    for (int i = 0; i \u003c len; i++) {\n        if (a[i] != b[i]) {\n            if (first_diff == -1) {\n                first_diff = i;\n            }\n            last_diff = i;\n        }\n    }\n\n    if (first_diff == -1) {\n        answer[id] = 0; // 两串完全相同，题目保证 t1 != t2，必无解\n        return;\n    }\n\n    // 扫描字符对串，每个结束位置 i >= R 产生一个子问题：\n    // 统计 fail 祖先中深度 >= i - L + 1 的终止节点数量（深度 = 规则长度）。\n    // state 始终是「T[0..i] 的最长后缀规则前缀」，fail 祖先就是所有匹配的规则。\n    int state = 0;\n    for (int i = 0; i \u003c len; i++) {\n        int ch = code_pair(a[i], b[i]);\n        state = move_state(state, ch);\n        if (i >= last_diff) {\n            Ask ask;\n            ask.need = i - first_diff + 1;\n            ask.state = state;\n            ask.id = id;\n            asks.push_back(ask);\n        }\n    }\n}"}, "answer_offline_asks": {"line": 281, "text": "void answer_offline_asks() {\n    bit.assign(node_cnt + 2, 0);\n\n    sort(terminal_nodes.begin(), terminal_nodes.end(), cmp_terminal_depth);\n    sort(asks.begin(), asks.end(), cmp_ask_need);\n\n    int ptr = 0;\n    int term_cnt = terminal_nodes.size();\n    int ask_cnt = asks.size();\n    for (int i = 0; i \u003c ask_cnt; i++) {\n        // 把深度足够的终止节点子树加进树状数组\n        while (ptr \u003c term_cnt && node[terminal_nodes[ptr]].depth >= asks[i].need) {\n            int u = terminal_nodes[ptr];\n            bit_range_add(node[u].tin, node[u].tout, node[u].weight);\n            ptr++;\n        }\n        answer[asks[i].id] += bit_query(node[asks[i].state].tin);\n    }\n}"}}}</script>

 return `<div class="ac-legend"><p><b>AC 自动机 = Trie + fail 指针</b></p><p><span class="legend-solid">实线箭头</span>：读字符对，走向 Trie 孩子。<span class="legend-dash">虚线箭头</span>：从节点指向 fail[node]，寻找后缀。</p><p>橙框是当前状态；绿色边框是规则终点。${contribution?'蓝色虚线是当前状态的 fail 链；绿色节点沿 fail 可以到达虚框规则终点，因此能收到该规则贡献。橙色填充表示本步正在登记的节点。':scan?'粗实线是本次成功转移，橙色虚线是本次失配回跳；蓝色虚线展示当前状态的后缀链。':'蓝色虚线是这次已经走过的 fail 指针；逐步展开时，Trie 的位置始终不变。'}</p><label><input type="checkbox" id="all-fail${acGraphSerial===1?'':'-'+acGraphSerial}" data-all-fail ${showAllFail?'checked':''}> 显示全部 fail 指针（取消后，只保留本次相关指针）</label></div><div class="tree ac-tree"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="AC 自动机：Trie 实线字符边与指向 fail 节点的虚线箭头"><defs>${[['trie','#82958a'],['fail','#9aabb8'],['follow','#245c98'],['jump','#b45b15'],['credit','#17694f']].map(([id,color])=>`<marker id="${graphID}-${id}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="${color}"/></marker>`).join('')}</defs>${trieEdges}${failEdges}${nodes}</svg></div><p class="muted"><small>树图可横向滚动，点击节点查看具体字符串。节点始终按 Trie 排列；是否匹配、是否收到贡献，要沿虚线 fail 指针判断。绿色节点可能分散在不同的 Trie 分支上。</small></p>`;

function countViewControl(){return `<div class="card"><label for="count-view">计数图形视图 </label><select id="count-view"><option value="ac" ${countView==='ac'?'selected':''}>AC 自动机：Trie + fail 指针（默认）</option><option value="fail" ${countView==='fail'?'selected':''}>fail 树：把 fail 指向改画成父子关系</option></select><p class="muted">切换只改变摆放方式，节点编号、匹配关系和已有贡献完全相同。AC 图中“向上找规则”指沿 fail 箭头走，不是沿 Trie 实线找父亲。</p></div>`;}

function stageScan(){const s=M.scans[scanPos],generated=M.scans.slice(0,scanPos+1).filter(x=>x.ask);return `<h2>扫描之后，ask 是怎样生成的？</h2><p>上排是原串，下排是目标串；每一列合成一个字符对，送入 AC。当前位置不一定匹配到完整规则。</p><div class="card">${queryStrip(s)}<div class="bar"><span class="tag focus">读取 ${s.c}</span><span class="tag">原状态 ${s.from}</span><span class="tag on">当前 state = ${s.state}</span></div><p>${s.jumps.length?'先沿 fail 回跳 '+s.jumps.map(([a,b])=>a+'→'+b).join('、')+'，再尝试转移。':'本次无需 fail 回跳。'}当前节点表示 <b>${esc(word(s.state))}</b>${M.nodes[s.state].rules.length?'，是规则终点。':'，不是规则终点，也可以成为 ask 的 state。'}</p><div class="note ${s.ask?'':'warn'}">${s.ask?`i=${s.i} ≥ last_diff=${s.R}，生成 <b>${askText(s.ask)}</b>。要向左覆盖 first_diff=${s.L}，长度至少为 ${s.i}−${s.L}+1=${s.ask.need}。`:`i=${s.i} &lt; last_diff=${s.R}，现在结尾还覆盖不到全部差异，不生成 ask。`}</div>${acGraph({current:s.state,chain:M.chain(s.state),scan:s})}${controls('scan',scanPos,M.scans.length-1,'扫描位置')}</div><div class="card"><h3>到现在已经生成的 ask</h3>${table(['ask','结束位置 i','state','need'],generated.map(s=>[s.ask.key,s.i,s.state,s.ask.need]))}<p class="muted">i 和 key 是教学辅助信息；源码 Ask 只保存 need、state、id，因为统计时不再需要 i。</p></div>`;}
function stageChain(){const s=M.scans[scanPos],chain=M.chain(s.state),shown=chain.slice(0,chainPos+1),found=shown.flatMap(u=>M.nodes[u].rules),r=selectedRule;return `<h2>从状态沿 fail 链，找出匹配的规则</h2><p>蓝色节点已经走到；绿色边框表示规则终点。每走到一个终点，就发现一条以当前位置结尾的匹配。这里先不检查长度。</p><div class="bar"><label for="scan-select">选择扫描位置</label><select id="scan-select">${M.scans.map((s,i)=>`<option value="${i}" ${i===scanPos?'selected':''}>Q${s.qid+1} / i=${s.i} / state=${s.state}${s.ask?' / need='+s.ask.need:''}</option>`).join('')}</select></div><div class="card">${queryStrip(s,r)}<div class="note">已展开：${shown.join(' → ')}。已找到规则：<b>${found.map(ruleName).join('、')||'暂时没有'}</b>。当前经过的节点若不是终点，不计规则。</div>${acGraph({current:s.state,chain:shown})}${controls('chain',chainPos,chain.length-1,'fail 链展开')}</div><div class="card"><h3>选择一条规则，核对具体子串</h3>${ruleButtons()}<p>规则 ${ruleName(r)}：${M.rules[r].join(' → ')}；终点 ${M.ends[r]}。${M.chain(s.state).includes(M.ends[r])?'<b>在当前 fail 链上，因此两条子串同时匹配。</b>':'不在当前 fail 链上，因此不能在这里结尾匹配。'}</p><p>当前位置的两条后缀：<code>${M.queries[s.qid][0].slice(Math.max(0,s.i-M.rules[r][0].length+1),s.i+1)} → ${M.queries[s.qid][1].slice(Math.max(0,s.i-M.rules[r][0].length+1),s.i+1)}</code>。</p><p class="muted">即使匹配，也要再检查覆盖差异所需的长度；下一节逐条检查这两个条件。</p></div>`;}

function stageDual(){const ask=M.asks[Math.min(selectedNode,M.asks.length-1)],u=M.ends[selectedRule],chain=M.chain(ask.state),desc=M.desc(u),match=chain.includes(u);return `<h2>同一个匹配关系，换两个方向观察</h2>${countViewControl()}<div class="bar"><label for="ask-select">观察哪个 ask</label><select id="ask-select">${M.asks.map((a,i)=>`<option value="${i}" ${i===Math.min(selectedNode,M.asks.length-1)?'selected':''}>${askText(a)}</option>`).join('')}</select></div><div class="card">${ruleButtons()}${queryStrip(ask,selectedRule)}</div><div class="grid"><div class="card"><h3>从状态出发：沿 fail 向上</h3><p>当前状态 ${ask.state} 的 fail 链为 ${chain.join(' → ')}。</p><p>能否经过规则 ${ruleName(selectedRule)} 的终点 ${u}？ <b>${match?'能，匹配。':'不能，不匹配。'}</b></p>${countGraph({current:ask.state,chain,chosen:u})}</div><div class="card"><h3>从规则出发：找 fail 后代</h3><p>沿 fail 能到达规则终点 ${u} 的状态为 {${desc.join(', ')}}，包含它自己；这组节点就是它的 fail 子树。</p><p>当前状态 ${ask.state} 在其中吗？ <b>${match?'在，匹配。':'不在，不匹配。'}</b></p>${countGraph({current:ask.state,affected:desc,chosen:u})}</div></div><div class="card note">两边说的是同一件事：<b>state 向上能找到规则 ⇔ 规则的后代中包含 state。</b>所以，激活规则时可以提前给它的全部 fail 后代各加 1。无关状态不在这棵子树中，收到的贡献仍为 0。注意：这一步只解释匹配关系，长度还要单独筛选。</div>`;}
function unsortedWarning(){let min=Infinity;for(const ask of M.asks){min=Math.min(min,ask.need);const wrong=M.rules.map((r,i)=>i).filter(r=>M.rules[r][0].length>=min&&M.rules[r][0].length<ask.need&&M.matches(ask,r));if(wrong.length)return `<div class="card note warn"><b>为什么不直接按原顺序保留贡献？</b><p>到 ${ask.key} 时，门槛升到 ${ask.need}，但前面已经允许长度 ≥ ${min} 的规则加入。规则 ${wrong.map(ruleName).join('、')} 仍留在里面，而且恰好在此处匹配，却太短！不撤销就会读出 ${M.directCount(ask)+wrong.length}，正确值是 ${M.directCount(ask)}。</p><p>改成 need 从大到小：先回答严格门槛，再补短规则。这样旧贡献始终合格，无须撤销。下面只演示这一遍排序后的过程。</p></div>`;}return '<div class="card note warn"><b>为什么排序？</b>原顺序的 need 会升高或降低。门槛升高时，之前加入的短规则可能不再合格；从大到小处理则只降低门槛，旧规则始终合格，只需补上新规则。这个案例中旧短规则不一定在升高门槛时恰好匹配，可切回主案例观察实际多算的情况。</div>';}
function stageOffline(){const s=snapshot(M,offlinePos),e=s.event,ask=s.ask,u=e?.u,chosen=u??-1;let text='还没有激活任何规则，所有状态的贡献都是 0。点击下一步，先选择 need 最大的 ask。';if(e){if(e.kind==='select')text=`选择 ${askText(ask)}。已有贡献全部保留；接下来只补上长度足够、但还没有登记的终点。`;if(e.kind==='activate')text=`终点 ${u} 的 Trie 深度为 ${M.nodes[u].depth} ≥ need=${ask.need}，激活规则 ${M.nodes[u].rules.map(ruleName).join('、')}。这不是给当前答案加一；下一步逐个给它的 fail 后代登记贡献。`;if(e.kind==='paint')text=`给节点 ${e.v} 登记规则 ${M.nodes[u].rules.map(ruleName).join('、')} 的贡献：它沿 fail 向上可以经过终点 ${u}。该节点现在累计 ${s.credits[e.v].length}。登记尚未结束时，不执行查询。`;if(e.kind==='advance')text=`终点 ${u} 的所有 fail 后代已登记完成，ptr 前移到 ${s.ptr}。贡献会保留，不会因为 ptr++ 消失。`;if(e.kind==='read')text=`没有尚未加入且长度 ≥ ${ask.need} 的规则了。读取 state=${ask.state} 已收到的贡献：${s.credits[ask.state].map(ruleName).join(' + ')||'0'} = ${s.credits[ask.state].length}，累加给 Q${ask.qid+1}。读取不会清空这些贡献。`;}
 return `<h2>离线：门槛从高到低，贡献只登记一次</h2>${countViewControl()}${unsortedWarning()}<div class="grid"><div class="card"><h3>原始 ask 顺序</h3>${M.asks.map(a=>`<span class="tag">${a.key} / ${a.need}</span>`).join('')}</div><div class="card"><h3>按 need 降序重排</h3>${M.sorted.map(a=>`<span class="tag ${a.key===ask?.key?'focus':''}">${a.key} / ${a.need}</span>`).join('')}</div></div><div class="card"><div class="note explanation" aria-live="polite">${text}</div><p><span class="tag">ptr = ${s.ptr} / ${M.terms.length}</span><span class="tag on">已激活终点 ${s.active.join('、')||'无'}</span>${ask?`<span class="tag focus">need = ${ask.need} / state = ${ask.state}</span>`:''}</p>${ask?queryStrip(ask):''}${table(['终点（按长度降序）','对应规则','Trie 深度','登记情况'],M.terms.map((u,i)=>[u,M.nodes[u].rules.map(ruleName).join('、'),M.nodes[u].depth,i<s.ptr?'已完整登记':s.active.includes(u)?'正在逐点登记':ask&&M.nodes[u].depth<ask.need?'长度不够，先不加入':'尚未处理']))}${countGraph({current:ask?.state??-1,chain:ask?M.chain(ask.state):[],affected:u===undefined?[]:M.desc(u),credits:s.credits,chosen,receiving:e?.kind==='paint'?e.v:-1})}<p class="muted">绿色填充：沿 fail 能到达本次规则的状态，会收到该规则贡献；不要沿 Trie 实线判断。橙框：当前 ask 的状态。每个节点下面直接写贡献来源；点击节点可检查详情。</p><div id="node-detail">${nodeDetail(Math.min(selectedNode,M.nodes.length-1),s.credits)}</div>${controls('offline',offlinePos,M.events.length,'登记/查询动作')}<div class="bar"><button id="next-read">前进到下一次读取</button><button id="autoplay">${autoTimer?'暂停播放':'慢速播放'}</button></div></div><div class="grid"><div class="card"><h3>当前 ask：长度与匹配仍是两道筛选</h3>${ask?table(['规则','长度够？','匹配？','此刻已收到？'],M.rules.map(([a,b],r)=>[ruleName(r),a.length>=ask.need?'是':'否',M.matches(ask,r)?'是':'否',s.credits[ask.state].includes(r)?'是':'否'])):'选择第一个 ask 后显示。'}<p class="muted">逐点登记过程会出现暂时未收到的情况；只有全部合格终点登记完成后才读取答案。</p></div><div class="card"><h3>已完成的读取</h3>${table(['ask','本次贡献','直接检查结果'],s.done.map(a=>[a.key,a.value,M.directCount(a)]))}<h3>原询问累计</h3>${M.queries.map((q,i)=>`<span class="tag">Q${i+1} = ${s.answers[i]}</span>`).join('')}<p>排序改变的是处理顺序  {q:'两个 ask 的 need 都为3，而且 state 相同。第一个读取1以后，第二个读取多少？',options:['0，规则已经用过','2，需要再次登记','1，贡献保留且读取不消耗'],correct:2,why:'ptr++ 是登记完成，不是使用完毕。第二次直接读取已有的值，再加入一次反而重复。回到第5节观察相同门槛的连续读取。',back:4},
 {q:'补全教学代码：终点u长度合格时，for (int v : ______) credit[v] += weight[u];',options:['所有AC节点','u的Trie后代（含自身）','u的fail后代（含自身）'],correct:2,why:'只有fail子树对应“规则u在这些状态下匹配”；Trie子树表示前缀扩展，是另一种关系。回到第4节。',back:3},
 {q:'要让旧贡献始终可以保留，ask 的 need 应怎样排序？',options:['从大到小','从小到大','按原询问编号'],correct:0,why:'门槛降低时，之前合格的规则仍合格，只需新增。门槛升高时会混入太短的旧规则。回到第5节。',back:4}
];
function stageCode(){return `<h2>最后，把画面放回源码</h2><div class="note">你刚才看到的统计过程，与下面源码的统计对象相同。页面用小循环逐点加权；源码把同一操作压缩成 DFS 序区间加。先理解上面的逐点过程，再恢复加速工具。</div><div class="grid"><div class="card"><h3>本页实际演示的等价操作</h3><pre>按规则长度降序排列终点
按 need 降序排列 ask
ptr = 0
for 每个 ask:
    while 下一个终点长度 >= ask.need:
        u = 下一个终点
        for v in u 的 fail 子树（含 u）:
            credit[v] += weight[u]
        ptr++
    answer[ask.id] += credit[ask.state]</pre><p>每个终点登记一次，每个 ask 读取一次。规则可以参与多个 ask，因为读取不会消耗登记的值。</p></div><div class="card"><h3>三个变量，三件事</h3><ul><li><code>ptr</code>：下一个尚未登记的终点在排序列表中的位置。</li><li><code>need</code>：这次只允许多长的规则参与统计。</li><li><code>state</code>：这次究竟读取哪个 AC 状态的累计值。</li></ul><p><code>depth</code> 是 Trie 深度，即规则长度；不是 fail 树层数。</p><p>逐点加权会重复访问很多节点，所以只适合教学小例子。源码用区间加与单点查加速这一步。</p></div></div><div class="card"><h3>main2.cpp 的真实离线函数</h3><p class="sources">起始行 ${SOURCE.blocks.answer_offline_asks.line}；源码 SHA-256：${SOURCE.hash}</p><pre>${esc(SOURCE.blocks.answer_offline_asks.text)}</pre><p><code>while</code> 只做长度筛选；<code>bit_range_add</code> 对应刚才整棵 fail 子树逐点登记；<code>bit_query</code> 对应读取 <code>credit[state]</code>。</p><details><summary>查看 ask 生成的真实代码</summary><pre>${esc(SOURCE.blocks.process_query.text)}</pre></details><p class="muted">源码注释中若出现“p ≥ L”，应按覆盖条件理解为“p ≤ L”；实际 need 公式正确。教程不修改提交源码。</p></div><div class="card"><h3>自己推一遍，再判断是否掌握</h3><p>下面的练习不因看完动画而自动通过。答错可以返回相应章节，再次尝试。</p>${QUIZZES.map((q,i)=>`<div class="card"><p><b>${i+1}.</b> ${q.q}</p><div class="answers">${q.options.map((o,k)=>`<button data-quiz="${i}:${k}">${esc(o)}</button>`).join('')}</div><div class="feedback" id="feedback-${i}" role="status"></div></div>`).join('')}<p>最后试着用自己的话解释：为什么“长度足够但不匹配”不会被计入？为什么 ptr++ 后规则还能继续贡献？</p></div>`;}
function render(){
 acGraphSerial=0;
 $('#nav').innerHTML=titles.map((t,i)=>`<button data-stage="${i}" ${i===stage?'class="selected" aria-current="step"':''}>${t}</button>`).join('');
 $('#intro').innerHTML=`<div class="grid"><div><h3>规则（相同内容、不同编号也分别计数）</h3>${M.rules.map(([a,b],r)=>`<span class="tag">${ruleName(r)}：${a} → ${b} · 长度 ${a.length} · 终点 ${M.ends[r]}</span>`).join('')}</div><div><h3>询问</h3>${M.queries.map(([a,b],i)=>`<span class="tag">Q${i+1}：${a} → ${b}</span>`).join('')}<p class="muted">全页基于这批实际字符串计算状态、fail 关系与计数，先后两种统计使用同一批 ask。</p></div></div>`;
 $('#content').innerHTML=[stageScan,stageChain,stageDirect,stageDual,stageOffline,stageCode][stage]();
 $('#previous-stage').disabled=stage===0;$('#next-stage').disabled=stage===5;
 document.querySelectorAll('.tree').forEach(el=>{const n=el.querySelector('.node.receiving')||el.querySelector('.node.current');if(n){const a=el.getBoundingClientRect(),b=n.getBoundingClientRect();if(b.left<a.left||b.right>a.right)el.scrollLeft+=b.left-a.left-(a.width-b.width)/2;}});
}
function goStage(s){clearInterval(autoTimer);autoTimer=null;stage=Math.max(0,Math.min(5,s));render();$('#stage-title').focus({preventScroll:true});$('#stage-title').scrollIntoView({block:'start',behavior:'instant'});}
function step(type,delta,end=false){if(type==='scan'){scanPos=end?M.scans.length-1:Math.max(0,Math.min(M.scans.length-1,scanPos+delta));chainPos=0;}if(type==='chain')chainPos=end?M.chain(M.scans[scanPos].state).length-1:Math.max(0,Math.min(M.chain(M.scans[scanPos].state).length-1,chainPos+delta));if(type==='direct')directPos=end?M.asks.length*(M.rules.length+1):Math.max(0,Math.min(M.asks.length*(M.rules.length+1),directPos+delta));if(type==='offline')offlinePos=end?M.events.length:Math.max(0,Math.min(M.events.length,offlinePos+delta));render();}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-node]');if(!b)return;if(b.dataset.stage!==undefined)goStage(Number(b.dataset.stage));if(b.dataset.step){const[t,d]=b.dataset.step.split(':');step(t,Number(d));}if(b.dataset.end)step(b.dataset.end,0,true);if(b.dataset.rule!==undefined){selectedRule=Number(b.dataset.rule);render();}if(b.dataset.node!==undefined){const u=Number(b.dataset.node);if(stage===4){selectedNode=u;$('#node-detail').innerHTML=nodeDetail(u,snapshot(M,offlinePos).credits);}else{let d=$('#tree-info');if(!d){d=document.createElement('div');d.id='tree-info';d.className='card note';$('#content').append(d);}d.innerHTML=nodeDetail(u);}}if(b.dataset.quiz){const[i,k]=b.dataset.quiz.split(':').map(Number),q=QUIZZES[i];$('#feedback-'+i).innerHTML=`<b>${k===q.correct?'判断正确。':'再检查一下。'}</b> ${q.why} <button data-stage="${q.back}">回看对应章节</button>`;}});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-node]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('change',e=>{if(e.target.id==='count-view'){countView=e.target.value;render();}if(e.target.matches('[data-all-fail]')){showAllFail=e.target.checked;render();}if(e.target.id==='scan-select'){scanPos=Number(e.target.value);chainPos=0;render();}if(e.target.id==='ask-select'){selectedNode=Number(e.target.value);render();}});
$('#case').onchange=reset;$('#reset').onclick=reset;$('#previous-stage').onclick=()=>goStage(stage-1);$('#next-stage').onclick=()=>goStage(stage+1);
document.addEventListener('click',e=>{if(e.target.id==='next-read'){do{offlinePos++;}while(offlinePos<M.events.length&&M.events[offlinePos-1]?.kind!=='read');offlinePos=Math.min(offlinePos,M.events.length);render();}if(e.target.id==='autoplay'){if(autoTimer){clearInterval(autoTimer);autoTimer=null;render();}else{autoTimer=setInterval(()=>{if(offlinePos>=M.events.length){clearInterval(autoTimer);autoTimer=null;render();return;}offlinePos++;render();},1400);render();}}});
window.lessonTest={buildModel,snapshot,cases:CASES,getModel:()=>M,getState:()=>({stage,scanPos,directPos,offlinePos}),goStage};reset();
</script></body></html>
