<script id="lesson-data" type="application/json">{"source": "/**\n * Author by Rainboy blog: https://rainboylv.com github: https://github.com/rainboylvx\n * rbook: -> https://rbook.roj.ac.cn  https://rbook2.roj.ac.cn\n * rainboy的学习导航网站: https://idx.roj.ac.cn\n * create_at: 2026-10-15 09:53\n * update_at: 2026-10-15 09:53\n */\n// main.cpp：map 精确分组差异核心，每组普通插入左右 Trie。\n// 左 Trie DFS 激活规则，在右 Trie 沿父指针直接求和。\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\ntypedef long long ll;\n\nconst int MAXNODE = 5000000 + 10; // 规则与询问单侧总长度至多 5000000，另有两个根\n\n// 稀疏 Trie：每个节点最多 26 个孩子，child/sibling 连接出边。\n// 节点、记录编号不超过 5000002，权重不超过 n，用 int 控制内存。\nstruct Node {\n    int ch, child, sibling, parent;\n    int items, weight;\n};\n\nstruct Item {\n    string a;      // 两侧内容均不改变，只需保存原串\n    int l, r;      // 首尾差异位置，0-based\n    int next;      // 同一差异核心组的记录链表\n    int left_next; // 挂在左 Trie 终点的记录链表\n    int right;     // 右 Trie 的终点\n    int id;        // 规则为 0，询问为原编号\n};\n\nstruct Group {\n    int head;\n    bool has_query;\n};\n\nstruct Frame {\n    int u, child; // 显式 DFS 栈：当前节点与尚未访问的下一个孩子\n};\n\nNode node[MAXNODE];\nint node_cnt;\nll n, q;\nmap\u003cpair\u003cstring, string>, int> core_id;\nvector\u003cItem> items(1); // 编号 0 表示链表结束\nvector\u003cGroup> groups(1);\nvector\u003cFrame> dfs_stack;\nvector\u003cll> answer;\n\nint new_node(int parent, int ch) {\n    node_cnt++;\n    node[node_cnt].ch = ch;\n    node[node_cnt].parent = parent;\n    node[node_cnt].child = node[node_cnt].sibling = 0;\n    node[node_cnt].items = node[node_cnt].weight = 0;\n    return node_cnt;\n}\n\n// 普通 Trie 插入：有这个孩子就走过去，没有就新建。\nint get_child(int u, int ch) {\n    for (int v = node[u].child; v != 0; v = node[v].sibling) {\n        if (node[v].ch == ch) return v;\n    }\n    int v = new_node(u, ch);\n    node[v].sibling = node[u].child;\n    node[u].child = v;\n    return v;\n}\n\nvoid read_item(int query_id) {\n    string a, b;\n    cin >> a >> b;\n    if (a.size() != b.size()) return;\n    int l = -1, r = <script>
'use strict';
// ===== 解法一（main.cpp）浏览器模型：差异核心分组 + 双 Trie + DFS 激活/撤销 =====
// 本文件是 ac-lesson-main1.html 内嵌 JS 的模型部分，刻意复刻 main.cpp 的执行细节：
// 孩子头插（最后插入的最先访问）、组内链表逆录入序、同节点先激活再回答、离开必撤销。

// 把二元组拆成 不变前缀 P + 差异核心 (coreA, coreB) + 不变后缀 S。
// 询问的 P/S 就是 X/Y：核心之外两条串本来就相同。
function splitPair(a, b) {
  if (a.length !== b.length) return null;
  let l = -1, r = -1;
  for (let i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) { if (l < 0) l = i; r = i; }
  }
  if (l < 0) return null; // 恒等二元组：不能把不同的目标串变得不同
  return {
    l, r,
    P: a.slice(0, l),
    S: a.slice(r + 1),
    coreA: a.slice(l, r + 1),
    coreB: b.slice(l, r + 1),
    len: a.length,
    span: r - l + 1,
  };
}

// 直接模拟「选规则 + 选起点」的暴力，用来当正确性对照。
function brute(rules, a, b) {
  if (a.length !== b.length) return 0;
  let ans = 0;
  for (const [x, y] of rules) {
    for (let p = 0; p + x.length <= a.length; p++) {
      if (a.slice(p, p + x.length) === x && a.slice(0, p) + y + a.slice(p + x.length) === b) ans++;
    }
  }
  return ans;
}

function coreKey(s) { return s.coreA + '\u0000' + s.coreB; }

function buildModel(rules, a, b) {
  const ruleInfo = rules.map(([x, y]) => (x.length === y.length ? splitPair(x, y) : null));
  const q = splitPair(a, b);

  // ---- map 精确分组（core_id）----
  const groups = [];
  const byKey = new Map();
  ruleInfo.forEach((s, i) => {
    if (!s) return;
    const k = coreKey(s);
    let g = byKey.get(k);
    if (!g) {
      g = { id: groups.length + 1, coreA: s.coreA, coreB: s.coreB, ruleIds: [] };
      groups.push(g);
      byKey.set(k, g);
    }
    g.ruleIds.push(i);
  });
  const qKey = q ? coreKey(q) : null;
  const group = q ? (byKey.get(qKey) || null) : null;

  // ---- 双 Trie：左插反转的不变前缀，右插正向的不变后缀 ----
  const mk = () => [{ id: 0, ch: null, parent: -1, children: [], items: [], path: '' }];
  const left = mk(), right = mk();
  const child = (list, u, ch) => {
    for (const v of list[u].children) if (list[v].ch === ch) return v;
    const v = list.length;
    list.push({ id: v, ch, parent: u, children: [], items: [], path: list[u].path + String.fromCharCode(97 + ch) });
    list[u].children.unshift(v); // 与 main.cpp 的 get_child 头插一致：最后插入的最先访问
    return v;
  };
  const entries = [];   // 每条记录的左右终点
  const insertOps = []; // 演示用：逐条插入动作
  if (group) {
    // main.cpp 组内链表头插 → 遍历是逆录入序；询问最后录入，最先插入
    const seq = [{ kind: 'query', id: -1 }, ...group.ruleIds.slice().reverse().map(id => ({ kind: 'rule', id }))];
    for (const e of seq) {
      const s = e.kind === 'query' ? q : ruleInfo[e.id];
      let u = 0;
      const lp = [...s.P].reverse();
      for (const c of lp) u = child(left, u, c.charCodeAt(0) - 97);
      let v = 0;
      for (const c of s.S) v = child(right, v, c.charCodeAt(0) - 97);
      e.leftEnd = u;
      e.rightEnd = v;
      e.split = s;
      left[u].items.push(e);
      right[v].items.push(e);
      entries.push(e);
      insertOps.push({ kind: e.kind, id: e.id, side: 'left', path: s.P, chars: lp, end: u });
      insertOps.push({ kind: e.kind, id: e.id, side: 'right', path: s.S, chars: [...s.S], end: v });
    }
  }

  // ---- 左 Trie DFS：进入激活、同节点先激活再回答、离开撤销 ----
  const rightChain = (v) => {
    const chain = [];
    for (let x = v; x !== -1; x = right[x].parent) chain.push(x);
    return chain;
  };
  function run(leak) {
    const weight = right.map(() => 0);
    const evs = [];
    const snap = () => weight.slice();
    const sum = (v) => rightChain(v).reduce((s, x) => s + weight[x], 0);
    function enter(u, stack) {
      evs.push({ kind: 'enter', u, stack: [...stack, u], weights: snap() });
      for (const it of left[u].items) {
        if (it.kind === 'rule') {
          weight[it.rightEnd]++;
          evs.push({ kind: 'activate', u, rule: it.id, right: it.rightEnd, weights: snap() });
        }
      }
      for (const it of left[u].items) {
        if (it.kind === 'query') {
          evs.push({ kind: 'answer', u, right: it.rightEnd, value: sum(it.rightEnd), weights: snap() });
        }
      }
      for (const v of left[u].children) enter(v, [...stack, u]);
      if (leak) {
        evs.push({ kind: 'leave', u, leak: true, weights: snap() }); // 模拟忘记撤销
      } else {
        for (const it of left[u].items) {
          if (it.kind === 'rule') weight[it.rightEnd]--;
        }
        evs.push({ kind: 'leave', u, weights: snap() });
      }
    }
    enter(0, []);
    return evs;
  }
  const events = run(false);
  const leakEvents = run(true);
  const pick = (evs) => (evs.find(e => e.kind === 'answer') || {}).value ?? 0;
  const answer = pick(events);
  const leakAnswer = pick(leakEvents);

  const queryEntry = entries.find(e => e.kind === 'query') || null;
  return {
    rules, a, b,
    ruleInfo, q, qKey,
    groups, group, inGroup: !!group,
    left, right, entries, insertOps,
    events, leakEvents, answer, leakAnswer,
    queryChain: queryEntry ? rightChain(queryEntry.rightEnd) : [],
    expected: brute(rules, a, b),
    stats: {
      leftNodes: left.length,
      rightNodes: right.length,
      groupCount: groups.length,
      groupRules: group ? group.ruleIds.length : 0,
    },
  };
}

    ${result !== null ? `<div class="str-wrap">${indexes(result)}${stringRow('替换结果', result, { interval: fits ? [p, end] : null, diff: false, seg: null })}</div>` : ''}

    <p class="takeaway">p + l = L 且 p + r = R：规则的首尾差异必须分别落在询问的首尾差异上，于是差异跨度 r−l 必须等于 R−L。</p>
    ${source('read_item', 'read_item 先找自己的首尾差异 l、r，再用 [l, r] 上的两条子串当核心去 map 里分组。', 'r - l + 1')}</section>`);
  target.querySelectorAll('[data-rule]').forEach(b => b.onclick = () => { ui.rule = +b.dataset.rule; renderDemo(); });
  $('align-start').oninput = e => { ui.alignStart = +e.target.value; renderDemo(); $('align-start').focus(); };

}

// ===== 第 2 关：前后缀分解 =====
function demoSplit(target) {
  const ri = model.ruleInfo[ui.rule], q = model.q;
  const cond = ri && q ? [
    { text: `(A,B) = (C,D)：核心 (${esc(ri.coreA)}, ${esc(ri.coreB)}) ${ri.coreA === q.coreA && ri.coreB === q.coreB ? '=' : '≠'} (${esc(q.coreA)}, ${esc(q.coreB)})`, ok: ri.coreA === q.coreA && ri.coreB === q.coreB },
    { text: `P 是 X 的后缀：<b>${esc(ri.P) || '空'}</b> ${isSuffix(ri.P, q.P) ? '是' : '不是'} <b>${esc(q.P) || '空'}</b> 的后缀`, ok: isSuffix(ri.P, q.P) },
    { text: `S 是 Y 的前缀：<b>${esc(ri.S) || '空'}</b> ${isPrefix(ri.S, q.S) ? '是' : '不是'} <b>${esc(q.S) || '空'}</b> 的前缀`, ok: isPrefix(ri.S, q.S) },

  }).join('');
  patchHTML(target, `<section class="card"><h3>核心之外，只剩两个独立的匹配条件</h3><p class="muted small">把每条规则和询问都拆成「不变前缀 · 差异核心 · 不变后缀」。中间允许夹相同字符，必须整体保留，否则会丢失差异之间的距离。</p>${ruleButtons()}
    ${ri ? `${indexes(model.rules[ui.rule][0])}${stringRow('规则 s₁ = P + A + S', model.rules[ui.rule][0], { seg: ri })}${stringRow('规则 s₂ = P + B + S', model.rules[ui.rule][1], { seg: ri })}${segCaption('规则 #' + (ui.rule + 1), ri, ['前缀 P', '后缀 S'])}` : `<div class="note warning">规则 #${ui.rule + 1} 是恒等规则，没有差异核心。</div>`}
    ${q ? `${strings({})}${segCaption('询问', q, ['前缀 X', '后缀 Y'])}` : ''}
    ${cond.length ? `<div class="table-wrap"><table><thead><tr><th>条件</th><th>结果</th></tr></thead><tbody>${cond.map(c => `<tr class="${c.ok ? 'ok' : 'reject'}"><td class="wrap">${c.text}</td><td>${c.ok ? '✓ 可用' : '× 不可用'}</td></tr>`).join('')}</tbody></table></div>` : ''}
    <div class="note ${usable ? '' : 'warning'} live" role="status"><strong>${usable ? '三个条件全部成立，这条规则能得到目标串。' : '有条件不成立，这条规则不能用在这次询问上。'}</strong> ${usable ? `替换起点唯一：p = |X| − |P| = ${q.P.length - ri.P.length}。` : '核心不同就不能替换；前后缀不贴合就会越界或留下差异。'}</div>
    <h4>全部规则的拆分与三个条件</h4>

    <p class="takeaway">三个条件互不干扰：核心管替换内容，前缀管左侧贴合，后缀管右侧贴合。两个「贴合」条件接下来分别交给左右两棵 Trie。</p>
    ${source('read_item', '差异核心就是 [l, r] 上的子串对；P、S 是它两侧的不变部分。', 'a.substr')}</section>`);
  target.querySelectorAll('[data-rule]').forEach(b => b.onclick = () => { ui.rule = +b.dataset.rule; renderDemo(); });

// ===== 第 3 关：map 核心分组 =====
function demoGroup(target) {
  const q = model.q;

  const ruleRows = model.rules.map(([a, b], i) => {
    const s = model.ruleInfo[i];
    return `<tr class="${model.group && s && s.coreA === model.group.coreA && s.coreB === model.group.coreB ? 'ok' : 'reject'}"><td>#${i + 1}</td><td class="mono">${esc(a)} → ${esc(b)}</td><td class="mono">${s ? `(${esc(s.coreA)}, ${esc(s.coreB)})` : '恒等，跳过'}</td><td>${s ? (model.group && s.coreA === model.group.coreA && s.coreB === model.group.coreB ? '本组' : '其它组') : '—'}</td></tr>`;
  }).join('');
  patchHTML(target, `<section class="card"><h3>map&lt;pair&lt;string,string&gt;, int&gt;：精确分组，不靠哈希</h3><p class="muted small">key 是差异核心的两条实际字符串。询问查表：命中就只和同组规则比，未命中答案直接 0。</p>
    <div class="stat-grid"><div class="stat"><small>核心种类数</small><strong>${model.stats.groupCount}</strong></div><div class="stat"><small>询问核心</small><strong class="mono">${q ? `(${esc(q.coreA)}, ${esc(q.coreB)})` : '—'}</strong></div><div class="stat blue"><small>查询结果</small><strong>${model.inGroup ? '命中组 ' + model.group.id : '未命中 → 0'}</strong></div></div>
    ${model.inGroup ? '' : `<div class="empty">map 里没有核心 ${q ? `(${esc(q.coreA)}, ${esc(q.coreB)})` : ''} 的规则组：任何规则都无法把 t₁ 变成 t₂，答案就是 0，不必再建 Trie。</div>`}
    <h4>map 里的所有组</h4>
    <div class="table-wrap"><table><thead><tr><th>组号</th><th>核心 key（A, B）</th><th>成员规则</th></tr></thead><tbody>${groupRows || '<tr><td colspan="3" class="wrap">没有非恒等规则</td></tr>'}</tbody></table></div>
    <h4>每条规则落到哪个组</h4>

    <div class="note">相同字符串、不同编号的规则会同时留在组里，后面在右终点权重上分别计数；恒等规则（左右串相同）直接跳过，因为一次替换不能「不改变」字符串还得到不同的目标。</div>
    <p class="takeaway">分组把「逐条规则比较核心」变成一次 map 查询；比较用真实字符串，结果确定，不依赖哈希防卡。</p>
    ${source('read_item', 'core_id 是 map<pair<string,string>,int>：插入新核心或取回已有组号；询问找不到组直接 return，答案保持 0。', 'core_id')}`);
}

// ===== 第 4 关：双 Trie 与反转 =====
function getPathTo(list, end) {
  const path = [];
  for (let x = end; x !== -1; x = list[x].parent) path.unshift(x);
  return path;
}
function ancOf(list, u, v) {
  for (let x = v; x !== -1; x = list[x].parent) if (x === u) return true;
  return false;
}
function demoTries(target) {
  if (!model.inGroup) {
    target.innerHTML = `<section class="card"><h3>先有核心，才有 Trie</h3><div class="empty">当前案例里询问的核心不在 map 中，答案直接是 0，main.cpp 根本不会为它建 Trie。换一个案例（如「原题样例」）查看双 Trie。</div></section>`;
    return;
  }
  const step = ui.insStep;
  const cur = step > 0 ? model.insertOps[step - 1] : null;
  const leftPath = cur && cur.side === 'left' ? getPathTo(model.left, cur.end) : [];
  const rightPath = cur && cur.side === 'right' ? getPathTo(model.right, cur.end) : [];
  const entryRows = model.entries.map(e => {
    const s = e.split;
    const lOk = ancOf(model.left, e.leftEnd, model.entries.find(x => x.kind === 'query').leftEnd);
    const rOk = ancOf(model.right, e.rightEnd, model.entries.find(x => x.kind === 'query').rightEnd);
    const isQ = e.kind === 'query';
    return `<tr class="${isQ ? 'focus' : lOk && rOk ? 'ok' : 'reject'}"><td>${isQ ? '询问' : '#' + (e.id + 1)}</td><td class="mono">${isQ ? esc(model.a) + ' → ' + esc(model.b) : esc(model.rules[e.id][0]) + ' → ' + esc(model.rules[e.id][1])}</td><td class="mono">${esc([...s.P].reverse().join('') || '空')}</td><td>${e.leftEnd}</td><td class="mono">${esc(s.S) || '空'}</td><td>${e.rightEnd}</td><td>${isQ ? '（比较基准）' : `${lOk ? '✓' : '×'} 左 / ${rOk ? '✓' : '×'} 右`}</td></tr>`;
  }).join('');
  const qEntry = model.entries.find(x => x.kind === 'query');
  const bothOk = model.entries.filter(e => e.kind === 'rule' && ancOf(model.left, e.leftEnd, qEntry.leftEnd) && ancOf(model.right, e.rightEnd, qEntry.rightEnd)).length;
  patchHTML(target, `<section class="card"><h3>反转一次，后缀条件变成祖先条件</h3><p class="muted small">左 Trie 收「反转的不变前缀」，右 Trie 收「正向的不变后缀」。空串对应根。单步看每条记录怎么落到两棵树上。</p>
    ${transport('ins', step, model.insertOps.length, `插入进度 ${step} / ${model.insertOps.length}`)}
    ${cur ? `<div class="note live" role="status"><strong>当前动作：</strong>${cur.kind === 'query' ? '询问' : '规则 #' + (cur.id + 1)} 的${cur.side === 'left' ? `反转不变前缀 <b class="mono">${esc(cur.chars.join('') || '空')}</b> 插入左 Trie，终点节点 <b>${cur.end}</b>` : `不变后缀 <b class="mono">${esc(cur.path || '空')}</b> 插入右 Trie，终点节点 <b>${cur.end}</b>`}。</div>` : '<div class="note">点击「下一步」，按 main.cpp 的顺序逐条插入：询问最先，规则随后。</div>'}
    <div class="split">
      <div>${tryGraph('left', { path: leftPath, current: cur && cur.side === 'left' ? cur.end : undefined })}</div>
      <div>${tryGraph('right', { path: rightPath, current: cur && cur.side === 'right' ? cur.end : undefined })}</div>
    </div>
    <h4>规则终点 (a, b) 与询问终点 (u, v)</h4>
    <div class="table-wrap"><table><thead><tr><th>记录</th><th>内容</th><th>rev(P) 路径</th><th>左终点</th><th>S 路径</th><th>右终点</th><th>祖先条件</th></tr></thead><tbody>${entryRows}</tbody></table></div>
    <div class="note live" role="status"><strong>${bothOk} 条规则</strong>同时满足「左终点是 u 的祖先」和「右终点是 v 的祖先」，它们恰好是这次询问的合法替换。</div>
    <p class="takeaway">P 是 X 的后缀 ⇔ rev(P) 是 rev(X) 的前缀 ⇔ 左 Trie 祖先（含自身）；S 是 Y 的前缀 ⇔ 右 Trie 祖先。两个条件独立，各查一棵树。</p>
    ${source('build_group', '左侧从 l-1 走到 0（反转），右侧从 r+1 走到末尾（正向）；空侧边停在根上。', 'i >= 0')}</section>`);
  bindTransport('ins', 'insStep', model.insertOps.length);
  bindTries();
}

// ===== 第 5 关：DFS 激活与撤销 =====
function eventText(ev) {
  if (ev.kind === 'enter') return `进入左节点 ${ev.u}${ev.u ? `（反转前缀 "${esc([...model.left[ev.u].path].reverse().join(''))}"）` : ''}`;
  if (ev.kind === 'activate') return `激活规则 #${ev.rule + 1}：右终点 ${ev.right} 权重 +1`;
  if (ev.kind === 'answer') return `回答询问：沿右链 ${ev.right} → 根求和 = ${ev.value}`;
  return ev.leak ? `离开节点 ${ev.u} —— 忘记撤销！规则仍留在右树上` : `离开节点 ${ev.u}：撤销这里的规则`;
}

  if (!model.inGroup) {

    return;
  }
  const evs = ui.leak ? model.leakEvents : model.events;
  const step = Math.min(ui.dfsStep, evs.length - 1);
  const ev = evs[step];
  const visited = new Set();
  for (let i = 0; i <= step; i++) if (evs[i].kind === 'enter') visited.add(evs[i].u);
  const weights = ev.weights;
  const answerEv = evs.find(e => e.kind === 'answer');
  const weightTiles = model.right.map(n => `<div class="dfs-tile ${weights[n.id] ? 'selected' : ''}"><small>${n.id === 0 ? '根' : String.fromCharCode(97 + n.ch)}</small><b>${weights[n.id]}</b></div>`).join('');
  const logRows = evs.map((e, i) => `<tr class="${i === step ? 'focus' : ''}"><td>${i + 1}</td><td class="wrap">${eventText(e)}</td></tr>`).join('');
  const isAnswer = ev.kind === 'answer';
  patchHTML(target, `<section class="card"><h3>进入激活，先答后走，离开撤销</h3><p class="muted small">左树是 DFS 的现场，右树上的数字是当前权重。跟着事件一步一步走，权重的变化就是计数的全部秘密。</p>
    ${transport('dfs', step, evs.length - 1, `事件 ${step + 1} / ${evs.length}`)}
    <label class="check-line"><input type="checkbox" id="leak-toggle" ${ui.leak ? 'checked' : ''}> 模拟「忘记撤销」：看看答案会怎么坏掉</label>
    <div class="note ${ev.kind === 'leave' && ev.leak ? 'warning' : 'live'}" role="status"><strong>事件 ${step + 1}：${eventText(ev)}</strong>${ev.kind === 'enter' && ev.stack.length ? ` · DFS 栈：${ev.stack.join(' → ')}` : ''}</div>
    <div class="split">
      <div>${tryGraph('left', { current: ev.u, visited })}</div>
      <div>${tryGraph('right', { weights, current: isAnswer ? ev.right : undefined, chain: isAnswer ? model.queryChain : undefined })}</div>
    </div>
    <h4>右 Trie 各节点权重</h4><div class="bit-strip">${weightTiles}</div>
    ${isAnswer ? `<div class="note ${ui.leak ? 'warning' : ''}" role="status"><strong>回答询问：</strong>${chainSumText(ev, weights)} = <b>${ev.value}</b>${ui.leak && ev.value !== model.expected ? `（正确答案是 ${model.expected}——泄漏进来的规则被误数了）` : ''}</div>` : ''}
    <h4>事件日志</h4>
    <div class="table-wrap" style="max-height:260px;overflow:auto"><table><thead><tr><th>#</th><th>事件</th></tr></thead><tbody>${logRows}</tbody></table></div>
    <p class="takeaway">同一节点先激活全部规则、再回答询问；离开必撤销。激活的规则恰好是「左终点在当前祖先链上」的规则，第一个条件就地解决。</p>
    ${source('enter_node', '两轮遍历节点记录链表：先给所有规则的右终点加权，再回答所有询问。', 'weight++')}${source('leave_node', '离开时逐条减权；少了这一步，规则会泄漏到兄弟分支。', 'weight--')}</section>`);
  bindTransport('dfs', 'dfsStep', evs.length - 1);
  $('leak-toggle').onchange = e => { ui.leak = e.target.checked; ui.dfsStep = 0; renderDemo(); };
  bindTries();

// ===== 第 6 关：右祖先链求和 =====

    <h4>求和步骤</h4>

    <h4>为什么直接走链不会超时</h4>
    <div class="table-wrap"><table><thead><tr><th>量</th><th>值</th></tr></thead><tbody><tr><td>第 j 个询问的链长</td><td class="mono">|Y_j| + 1</td></tr><tr><td>所有询问的链长合计</td><td class="mono">Σ|Y_j| + q ≤ L₂ + q</td></tr><tr class="ok"><td>总代价</td><td><b>O(L₂)</b>：输入已经为长链付过字符串长度</td></tr></tbody></table></div>
    <div class="note">这就是本解法不需要树状数组的原因：祖先求和被「链长 = 不变后缀长度」摊还掉了。根代表空不变后缀，也必须参与求和。</div>
    <p class="takeaway">左 DFS 管前缀条件，右链求和管后缀条件，核心分组管内容相同——三件事合起来就是一次合法替换的充要条件。</p>
    ${source('enter_node', '查询循环里 v 从右终点沿 parent 走到根（v != 0 中的 0 是哨兵，实际右根也参与求和）。', 'node[v].parent')}</section>`);
  bindTransport('sum', 'sumStep', chain.length - 1);
  bindTries();
}

// ===== 第 7 关：回到 main.cpp =====
const codeNotes = {
  new_node: '动态开点：Node 数组当节点池，组间把 node_cnt 归零重复使用，只初始化真正用到的节点。',
  get_child: '普通 Trie 插入的一步：在稀疏孩子链表里找字符，找到就走，找不到头插一个新节点。',
  read_item: '拆分与分组：定位首尾差异 l、r，取核心去 map 里查组；询问找不到组直接返回，答案保持 0。',
  build_group: '双 Trie 插入：左侧反转不变前缀、右侧正向不变后缀，空侧边停在根；记录左右终点。',
  enter_node: '进入左节点：第一轮激活全部规则（右终点权重 +1），第二轮回答询问（沿右父指针求和）。',
  leave_node: '离开左节点：把这里的规则权重减回去，避免泄漏到兄弟分支。',
  dfs_left: '显式栈模拟 DFS：栈帧保存当前节点与下一个待访问孩子，避免超长前缀递归爆栈。',
};
function demoCode(target) {
  const name = ui.code;
  const qEntry = model.entries.find(e => e.kind === 'query');
  const ruleRows = model.rules.map(([a, b], i) => {
    const s = model.ruleInfo[i];
    const inG = model.inGroup && s && s.coreA === model.group.coreA && s.coreB === model.group.coreB;
    const ok = inG && isSuffix(s.P, model.q.P) && isPrefix(s.S, model.q.S);
    const why = !s ? '恒等规则，跳过' : !inG ? '核心不同，其它组' : !isSuffix(s.P, model.q.P) ? '不变前缀不贴合' : !isPrefix(s.S, model.q.S) ? '不变后缀不贴合' : '合法替换';
    return `<tr class="${ok ? 'ok' : 'reject'}"><td>#${i + 1}</td><td class="mono">${esc(a)} → ${esc(b)}</td><td>${inG ? (ok ? '✓ 计入' : '× 不计') : '× 不计'}</td><td class="wrap">${why}</td></tr>`;
  }).join('');
  target.innerHTML = `<section class="card"><h3>把整条链路接回 main.cpp</h3><div class="pipeline"><span>① <b>核心分组</b></span><span>② <b>双 Trie</b></span><span>③ <b>DFS 激活/撤销</b></span><span>④ <b>右链求和</b></span></div>
    <div class="table-wrap"><table><thead><tr><th>你已经理解的含义</th><th>main.cpp 中的名字</th></tr></thead><tbody>
    <tr><td class="wrap">差异核心（A, B）</td><td><code>core_id</code> 的 key：<code>a.substr(l, r-l+1)</code> 对</td></tr>
    <tr><td class="wrap">不变前缀 / 不变后缀</td><td><code>items[id].a</code> 的 <code>[0, l-1]</code> / <code>[r+1, len)</code></td></tr>
    <tr><td class="wrap">规则左右终点</td><td><code>node[u].items</code> 挂载点 / <code>items[id].right</code></td></tr>
    <tr><td class="wrap">已激活规则的权重</td><td><code>node[v].weight</code></td></tr>
    <tr><td class="wrap">右祖先链求和</td><td><code>enter_node</code> 里的 <code>for (v = right; v != 0; v = parent)</code></td></tr>
    <tr><td class="wrap">显式 DFS 栈</td><td><code>Frame{u, child}</code> 与 <code>dfs_left()</code></td></tr>
    <tr><td class="wrap">组间复用节点池</td><td><code>node_cnt = 0</code> + <code>new_node()</code></td></tr>
    </tbody></table></div>
    <h4>点击函数，阅读对应的真实源码</h4>
    <div class="code-nav">${Object.keys(codeNotes).map(n => `<button data-code="${n}" class="${n === name ? 'selected' : ''}">${n}()</button>`).join('')}</div>
    <p>${codeNotes[name]}</p>${codeBlock(name, name === 'enter_node' ? 'weight' : name === 'read_item' ? 'core_id' : '')}
    <div class="stat-grid"><div class="stat"><small>左 Trie 节点数</small><strong>${model.stats.leftNodes}</strong></div><div class="stat"><small>右 Trie 节点数</small><strong>${model.stats.rightNodes}</strong></div><div class="stat"><small>核心组数</small><strong>${model.stats.groupCount}</strong></div><div class="stat blue"><small>最终 answer</small><strong>${model.answer}</strong></div></div>
    <h4>每条规则的最终判定</h4>
    <div class="table-wrap"><table><thead><tr><th>编号</th><th>规则</th><th>计入？</th><th>原因</th></tr></thead><tbody>${ruleRows}</tbody></table></div>
    <div class="note ${model.answer === model.expected ? '' : 'warning'}">浏览器模型算出 <b>${model.answer}</b>，暴力枚举算出 <b>${model.expected}</b>${model.answer === model.expected ? '，两者一致。' : '，不一致——请检查模型！'}</div>
    <h4>不重复、不遗漏</h4>
    <div class="note">每条合法规则对一个询问只有一个可能起点（p = |X| − |P|），只在自己的右终点加一次权重，所以恰好被数一次；相同字符串不同编号的规则各自激活一次，符合题目的计数要求。</div>
    <details><summary>复杂度与实现细节，最后再看</summary>
    <p>设 T = L₁ + L₂。核心种类至多 n，map 查找/插入每次 O(log(n+1)) 次比较、每次比较最坏 O(核心长度)，分组总成本 O(T·log(n+1))。普通 Trie 插入每字符最多比较 26 个孩子，合计 O(26T)。每条规则只激活、撤销一次；右链求和合计 O(L₂ + q)。总时间 O(T·log(n+1) + 26T)，空间 O(T + n + q)。</p>
    <p>实现细节：稀疏孩子链表（无 26 路数组）；组间复用节点池；记录链表 <code>next</code> 与左终点挂载链表 <code>left_next</code> 分开；DFS 用显式栈。追求严格线性时，看解法四如何替换核心分组与建树。</p>
    <p>题目保证 t₁ ≠ t₂；代码里对相等字符串返回 0 只是范围外保护，不是在数「不改变字符串」的替换。</p></details>
    <details class="source"><summary>查看 main.cpp 完整源码（已内嵌，可离线阅读）</summary><div class="toolbar"><button class="btn small" id="copy-source">复制源码</button><span class="small muted" id="copy-status" role="status"></span></div><div class="code-box" tabindex="0"><pre>${DATA.source.split('\n').map((line, i) => `<span class="code-line"><span class="ln">${i + 1}</span>${tokenCode(line)}</span>`).join('')}</pre></div></details></section>`;
  target.querySelectorAll('[data-code]').forEach(b => b.onclick = () => { ui.code = b.dataset.code; renderDemo(); });
  $('copy-source').onclick = async () => {
    try { await navigator.clipboard.writeText(DATA.source); $('copy-status').textContent = '已复制。'; }
    catch { $('copy-status').textContent = '此浏览器不允许直接复制，请选中下方源码复制。'; }
  };
}
