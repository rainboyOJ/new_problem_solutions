<div class="shell"><aside class="sidebar"><div class="eyebrow">一条主线 · 八个小问题</div><h1>你会 AC，<br>接着往前一步。</h1><p>先做预测，再亲手演示。<br>每次只消化一个新条件。</p><nav class="nav" id="nav" aria-label="关卡导航"></nav><div class="known"><strong>从你已有的知识出发</strong><p>AC 自动机 · 树状数组 · 离线处理</p><p>DFS 序会单独演示。字符串位置与根编号从 0 开始，DFS 序从 1 开始。</p></div></aside>

<script id="lesson-data" type="application/json">{"source": "/**\n * Author by Rainboy blog: https://rainboylv.com github: https://github.com/rainboylvx\n * rbook: -> https://rbook.roj.ac.cn  https://rbook2.roj.ac.cn\n * rainboy的学习导航网站: https://idx.roj.ac.cn\n * create_at: 2026-06-22 19:52\n * update_at: 2026-10-15 12:30\n */\n// main2.cpp：把规则和询问都转成字符对串，用 AC 自动机匹配，\n// 再在 fail 树上按长度阈值离线计数。\n//\n// ==================== 教学导读 ====================\n// 【核心思想：一次扫描同时匹配所有规则】逐询问逐规则检查太慢，\n// 换个看法：一条规则在起点 p 可用 ⟺ 对每个 k，t1[p+k] = s1[k] 且 t2[p+k] = s2[k]。\n// 把 t1、t2 逐位合成「字符对串」T：T[i] = (a[i], b[i])（编码 0..675），\n// 规则也合成字符对串 R：R[k] = (s1[k], s2[k])。那么规则在 p 可用\n// ⟺ R 恰好是 T[p .. p+|R|-1] 这段子串 —— 就是普通的模式串匹配！\n//\n// 【还要覆盖差异区间 [L, R]】规则长度为 k、起点为 p 时，要求 [p, p+k-1] ⊇ [L, R]。\n// 固定结束位置 i = p+k-1（i >= R），则 p = i-k+1 >= L，即 k >= i-L+1。\n// 于是：以 i 结尾、长度 >= i-L+1 的规则，都恰好贡献一个方案。\n//\n// 【AC 自动机 + fail 树怎么数】所有规则插入 Trie 建 AC 自动机，扫描 T 时每个位置 i\n// 得到一个状态 state(i)。state(i) 的 fail 祖先（含自身）恰好是「所有以 i 结尾的\n// 匹配规则」。把 fail 反过来建树，规则终点就是一些节点，问题变成：\n//   对每个 (state, 阈值 k0)：state 的 fail 祖先里，深度 >= k0 的终止节点有多少个？\n// 对每个 i >= R 拆一个这样的子问题（阈值 k0 = i-L+1）。\n//\n// 【离线回答】把终止节点按深度降序、子问题按阈值降序排序，双指针推进：\n// 深度足够的终止节点就把它的 fail 子树整体 +weight（用 DFS 序区间加），\n// 查询 state 的 tin 位置单点值。这就是树状数组上的经典离线套路。\n//\n// 【图怎么存】Trie 和 fail 树都用「vector\u003cint> g[maxn] 邻接表」存孩子：\n//   trie_g[u] 是 u 的 Trie 孩子，边字符挂在孩子上（node[v].ch = 到 v 的边字符）；\n//   fail_g[u] 是 u 在 fail 树上的孩子。\n// 建完 Trie 后给每个节点的孩子按字符排序，find_child 就能二分查找，转移 O(log 676)。\n// AC 自动机用 std::queue 做 BFS 建 fail 指针；fail 树分两步：先建树（build_fail_tree\n// 只加边），再在树上遍历求 DFS 序（dfs_fail_tree），每一步都一眼能看懂。\n//\n// 【复杂度】O((L1+L2) log(L1+L2))，适用于全部数据。\n#include \u003cbits/stdc++.h>\nusing namespace std;\n\ntypedef long long ll;\n\n// Trie 只由规则建成：L1 = 规则左右串总长度 \u003c= 5e6，单侧 \u003c= 2.5e6，\n// 所以节点数不超过 2500001。两个 vector\u003cint> 邻接表各占 24 字节/节点。\nconst int MAXNODE = 2500000 + 10;\n\n// 一个 Trie 节点。深度 = 到根路径上的字符数，即该节点对应字符对串的长度。\nstruct Node {\n    int ch;     // 入边上的字符对编码 0..675；根没有入边，记 -1\n    int depth;  // 深度 = 该节点对应字符对串的长度（就是规则长度）\n    int fail;   // fail 指针\n    int weight; // 终止权重：以该节点结尾的规则条数（相同规则不去重）\n    int tin;    // fail 树 DFS 序：进入时间戳\n    int tout;   // fail 树 DFS 序：离开时间戳，子树是区间 [tin, tout]\n};\n\n// Ask：一个离线子问题\n// need：规则长度阈值（只统计深度 >= need 的终止节点）；\n// state：询问扫描到的 AC 状态（所有以当前位置结尾的匹配规则都在它的 fail 祖先上）；\n// id：原始询问编号（一个询问会拆出多个子问题，答案累加）\nstruct Ask {\n    int need;\n    int state;\n    int id;\n};\n\nint n, q;\n\nNode node[MAXNODE];         // 节点池，编号 0..node_cnt-1，0 是根\nvector\u003cint> trie_g[MAXNODE]; // trie_g[u]：u 的 Trie 孩子（vector\u003cint> g[maxn] 存图）\nvector\u003cint> fail_g[MAXNODE]; // fail_g[u]：u 在 fail 树上的孩子（同一套存图方式）\nint node_cnt;                // 已创建的节点数，新建节点的编号就是 node_cnt\n\nint dfs_timer; // fail 树 DFS 序的时间戳\n\nvector\u003cint> terminal_nodes; // 所有终止节点\nvector\u003cAsk> asks;           // 所有离线子问题\nvector\u003cll> answer;          // 每个询问的答案\nvector\u003cll> bit;             // 树状数组（差分 + 单点查前缀）\n\n// 一对字符 (a, b) 编码成 0..675 的新字符：\n// 把「双串逐位相等」变成「单串子串匹配」，是本解法最关键的一步。\nint code_pair(char a, char b) {\n    return (a - 'a') * 26 + (b - 'a');\n}\n\n// 新建一个节点，入边字符为 ch，返回编号\nint new_node(int ch) {\n    int id = node_cnt;\n    node_cnt++;\n    node[id].ch = ch;\n    node[id].depth = 0;\n    node[id].fail = 0;\n    node[id].weight = 0;\n    node[id].tin = 0;\n    node[id].tout = 0;\n    return id;\n}\n\n// 建树时取 u 的 ch 孩子，不存在就新建。\n// 此时孩子还没排序，线性扫一遍；建完 Trie 统一排序后才用 find_child 二分。\nint get_or_add_child(int u, int ch) {\n    for (size_t i = 0; i \u003c trie_g[u].size(); i++) {\n        int v = trie_g[u][i];\n        if (node[v].ch == ch) {\n            return v;\n        }\n    }\n    int v = new_node(ch);\n    node[v].depth = node[u].depth + 1;\n    trie_g[u].push_back(v);\n    return v;\n}\n\n// 在 u 的孩子里二分查找字符 ch 对应的孩子，找不到返回 -1。\n// 前提：trie_g[u] 已按 node[v].ch 升序排好（sort_children 做的）。\nint find_child(int u, int ch) {\n    int cnt = trie_g[u].size(); // 孩子个数\n    int l = 0;\n    int r = cnt - 1;\n    while (l \u003c= r) {\n        int mid = (l + r) >> 1;\n        int v = trie_g[u][mid];\n        if (node[v].ch == ch) {\n            return v;\n        }\n        if (node[v].ch \u003c ch) {\n            l = mid + 1;\n        } else {\n            r = mid - 1;\n        }\n    }\n    return -1;\n}\n\n// 把规则 (a, b) 的字符对串插入 Trie，终止节点权值 +1\nvoid insert_pair_string(const string &a, const string &b) {\n    int u = 0;\n    int len = a.size();\n    for (int i = 0; i \u003c len; i++) {\n        int ch = code_pair(a[i], b[i]);\n        u = get_or_add_child(u, ch);\n    }\n    node[u].weight++;\n}\n\n// Trie 孩子按入边字符升序排序（比较函数不用 lambda）\nbool cmp_child(int a, int b) {\n    return node[a].ch \u003c node[b].ch;\n}\n\n// 给每个节点的孩子排序，之后 find_child 可以二分查找\nvoid sort_children() {\n    for (int u = 0; u \u003c node_cnt; u++) {\n        if (trie_g[u].size() > 1) {\n            sort(trie_g[u].begin(), trie_g[u].end(), cmp_child);\n        }\n    }\n}\n\n// 沿 fail 链走一步转移，返回下一个 AC 状态\nint move_state(int u, int ch) {\n    while (u != 0 && find_child(u, ch) == -1) {\n        u = node[u].fail;\n    }\n    int v = find_child(u, ch);\n    if (v == -1) {\n        return 0;\n    }\n    return v;\n}\n\n// BFS 建 AC 自动机的 fail 指针，用 std::queue 逐层扩展\nvoid build_ac_automaton() {\n    queue\u003cint> que;\n\n    // 根的孩子 fail 指向根\n    for (size_t i = 0; i \u003c trie_g[0].size(); i++) {\n        int v = trie_g[0][i];\n        node[v].fail = 0;\n        que.push(v);\n    }\n\n    while (!que.empty()) {\n        int u = que.front();\n        que.pop();\n        for (size_t i = 0; i \u003c trie_g[u].size(); i++) {\n            int v = trie_g[u][i];\n            int ch = node[v].ch;\n\n            // 求 fail[v]：从 fail[u] 出发沿 fail 链找能走字符 ch 的节点，\n            // 找不到就落到根。这个节点就是 v 对应串的最长真后缀所在位置。\n            int f = node[u].fail;\n            while (f != 0 && find_child(f, ch) == -1) {\n                f = node[f].fail;\n            }\n            int go = find_child(f, ch);\n            if (go == -1) {\n                node[v].fail = 0;\n            } else {\n                node[v].fail = go;\n            }\n            que.push(v);\n        }\n    }\n}\n\n// 建 fail 树：把每个非根节点挂到 fail 指针指向的节点下面，只加边，不遍历。\n// fail 指针反向后恰好是一棵树（根是 0）：u 的 fail 祖先就是 u 到根的路径。\nvoid build_fail_tree() {\n    for (int i = 1; i \u003c node_cnt; i++) {\n        fail_g[node[i].fail].push_back(i);\n    }\n}\n\n// 在 fail 树上遍历求 DFS 序：u 的子树对应连续区间 [tin[u], tout[u]]。\n// 用显式栈模拟递归，避免长链（深度可达百万级）爆系统栈。\nvoid dfs_fail_tree() {\n    dfs_timer = 0;\n    vector\u003cint> st;      // 当前 DFS 路径\n    vector\u003csize_t> iter; // 每个栈帧下一个要访问的孩子下标\n\n    st.push_back(0);\n    iter.push_back(0);\n    node[0].tin = ++dfs_timer;\n\n    while (!st.empty()) {\n        int u = st.back();\n        if (iter.back() \u003c fail_g[u].size()) {\n            // 还有孩子没访问：进入下一个孩子\n            int v = fail_g[u][iter.back()];\n            iter.back()++;\n            node[v].tin = ++dfs_timer;\n            st.push_back(v);\n            iter.push_back(0);\n        } else {\n            // 孩子全部访问完：离开 u，子树区间到此为止\n            node[u].tout = dfs_timer;\n            st.pop_back();\n            iter.pop_back();\n        }\n    }\n}\n\n// ---- 树状数组：区间加、单点查（差分实现）----\n\nvoid bit_add(int pos, ll val) {\n    int nbit = bit.size() - 1;\n    while (pos \u003c= nbit) {\n        bit[pos] += val;\n        pos += pos & -pos;\n    }\n}\n\nvoid bit_range_add(int l, int r, ll val) {\n    bit_add(l, val);\n    bit_add(r + 1, -val);\n}\n\nll bit_query(int pos) {\n    ll res = 0;\n    while (pos > 0) {\n        res += bit[pos];\n        pos -= pos & -pos;\n    }\n    return res;\n}\n\n// 终止节点按深度从大到小排序\nbool cmp_terminal_depth(int a, int b) {\n    return node[a].depth > node[b].depth;\n}\n\n// 离线子问题按长度阈值从大到小排序\nbool cmp_ask_need(const Ask &a, const Ask &b) {\n    return a.need > b.need;\n}\n\n// 离线回答所有子问题：\n// 深度不小于阈值的终止节点，其 fail 子树整体加权后，查状态的 DFS 序位置。\n// 为什么查 tin[state] 就够：终止节点 u 加在 [tin[u], tout[u]] 上，\n// u 是 state 的 fail 祖先 ⟺ state 在 u 的子树里 ⟺ tin[state] ∈ [tin[u], tout[u]]。\nvoid answer_offline_asks() {\n    bit.assign(node_cnt + 2, 0);\n\n    sort(terminal_nodes.begin(), terminal_nodes.end(), cmp_terminal_depth);\n    sort(asks.begin(), asks.end(), cmp_ask_need);\n\n    int ptr = 0;\n    int term_cnt = terminal_nodes.size();\n    int ask_cnt = asks.size();\n    for (int i = 0; i \u003c ask_cnt; i++) {\n        // 把深度足够的终止节点子树加进树状数组\n        while (ptr \u003c term_cnt && node[terminal_nodes[ptr]].depth >= asks[i].need) {\n            int u = terminal_nodes[ptr];\n            bit_range_add(node[u].tin, node[u].tout, node[u].weight);\n            ptr++;\n        }\n        answer[asks[i].id] += bit_query(node[asks[i].state].tin);\n    }\n}\n\n// 处理一个询问：找出 [L,R] 后，把每个可能结束位置拆成一个离线子问题。\n// 规则长度为 k、替换起点为 p 时，要求区间 [p, p+k-1] 覆盖 [L, R]，\n// 于是 p = L - (k 的差异前缀长)，等价于统计深度阈值满足条件的终止节点个数。\n// 换个更直接的说法：结束位置 i = p+k-1 必须 >= R，且 p = i-k+1 >= L，\n// 所以 k >= i-L+1；每个 i >= R 对应一个子问题 (state(i), need = i-L+1)。\nvoid process_query(int id, const string &a, const string &b) {\n    // 替换不改变长度\n    if (a.size() != b.size()) {\n        answer[id] = 0;\n        return;\n    }\n\n    int len = a.size();\n    // first_diff / last_diff 即询问两串的差异区间 [L, R]\n    int first_diff = -1;\n    int last_diff = -1;\n    for (int i = 0; i \u003c len; i++) {\n        if (a[i] != b[i]) {\n            if (first_diff == -1) {\n                first_diff = i;\n            }\n            last_diff = i;\n        }\n    }\n\n    if (first_diff == -1) {\n        answer[id] = 0; // 两串完全相同，题目保证 t1 != t2，必无解\n        return;\n    }\n\n    // 扫描字符对串，每个结束位置 i >= R 产生一个子问题：\n    // 统计 fail 祖先中深度 >= i - L + 1 的终止节点数量（深度 = 规则长度）。\n    // state 始终是「T[0..i] 的最长后缀规则前缀」，fail 祖先就是所有匹配的规则。\n    int state = 0;\n    for (int i = 0; i \u003c len; i++) {\n        int ch = code_pair(a[i], b[i]);\n        state = move_state(state, ch);\n        if (i >= last_diff) {\n            Ask ask;\n            ask.need = i - first_diff + 1;\n            ask.state = state;\n            ask.id = id;\n            asks.push_back(ask);\n        }\n    }\n}\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n\n    cin >> n >> q;\n    new_node(-1); // 先把根节点（编号 0）开出来，根没有入边字符\n\n    // 每条规则的左右串逐位合成字符对串，插入 Trie\n    string a, b;\n    for (int i = 1; i \u003c= n; i++) {\n        cin >> a >> b;\n        insert_pair_string(a, b);\n    }\n\n    sort_children();      // 孩子按边字符排序，find_child 才能二分查找\n    build_ac_automaton(); // BFS 求 fail 指针\n    build_fail_tree();    // fail 指针反向建树（只加边）\n    dfs_fail_tree();      // 在 fail 树上遍历，求 DFS 序\n\n    // 收集所有终止节点（即所有规则串的结尾）\n    for (int i = 1; i \u003c node_cnt; i++) {\n        if (node[i].weight > 0) {\n            terminal_nodes.push_back(i);\n        }\n    }\n\n    answer.assign(q + 1, 0);\n    asks.reserve(1000000);\n    // 每个询问在线拆成若干离线子问题，扫完 Trie 后统一回答\n    for (int id = 1; id \u003c= q; id++) {\n        cin >> a >> b;\n        process_query(id, a, b);\n    }\n\n    answer_offline_asks();\n\n    for (int id = 1; id \u003c= q; id++) {\n        cout \u003c\u003c answer[id] \u003c\u003c '\\n';\n    }\n\n    return 0;\n}\n", "blocks": {"code_pair": {"start": 85, "lines": ["int code_pair(char a, char b) {", "    return (a - 'a') * 26 + (b - 'a');", "}"]}, "insert_pair_string": {"start": 139, "lines": ["void insert_pair_string(const string &a, const string &b) {", "    int u = 0;", "    int len = a.size();", "    for (int i = 0; i \u003c len; i++) {", "        int ch = code_pair(a[i], b[i]);", "        u = get_or_add_child(u, ch);", "    }", "    node[u].weight++;", "}"]}, "build_ac_automaton": {"start": 176, "lines": ["void build_ac_automaton() {", "    queue\u003cint> que;", "", "    // 根的孩子 fail 指向根", "    for (size_t i = 0; i \u003c trie_g[0].size(); i++) {", "        int v = trie_g[0][i];", "        node[v].fail = 0;", "        que.push(v);", "    }", "", "    while (!que.empty()) {", "        int u = que.front();", "        que.pop();", "        for (size_t i = 0; i \u003c trie_g[u].size(); i++) {", "            int v = trie_g[u][i];", "            int ch = node[v].ch;", "", "            // 求 fail[v]：从 fail[u] 出发沿 fail 链找能走字符 ch 的节点，", "            // 找不到就落到根。这个节点就是 v 对应串的最长真后缀所在位置。", "            int f = node[u].fail;", "            while (f != 0 && find_child(f, ch) == -1) {", "                f = node[f].fail;", "            }", "            int go = find_child(f, ch);", "            if (go == -1) {", "                node[v].fail = 0;", "            } else {", "                node[v].fail = go;", "            }", "            que.push(v);", "        }", "    }", "}"]}, "move_state": {"start": 164, "lines": ["int move_state(int u, int ch) {", "    while (u != 0 && find_child(u, ch) == -1) {", "        u = node[u].fail;", "    }", "    int v = find_child(u, ch);", "    if (v == -1) {", "        return 0;", "    }", "    return v;", "}"]}, "process_query": {"start": 310, "lines": ["void process_query(int id, const string &a, const string &b) {", "    // 替换不改变长度", "    if (a.size() != b.size()) {", "        answer[id] = 0;", "        return;", "    }", "", "    int len = a.size();", "    // first_diff / last_diff 即询问两串的差异区间 [L, R]", "    int first_diff = -1;", "    int last_diff = -1;", "    for (int i = 0; i \u003c len; i++) {", "        if (a[i] != b[i]) {", "            if (first_diff == -1) {", "                first_diff = i;", "            }", "            last_diff = i;", "        }", "    }", "", "    if (first_diff == -1) {", "        answer[id] = 0; // 两串完全相同，题目保证 t1 != t2，必无解", "        return;", "    }", "", "    // 扫描字符对串，每个结束位置 i >= R 产生一个子问题：", "    // 统计 fail 祖先中深度 >= i - L + 1 的终止节点数量（深度 = 规则长度）。", "    // state 始终是「T[0..i] 的最长后缀规则前缀」，fail 祖先就是所有匹配的规则。", "    int state = 0;", "    for (int i = 0; i \u003c len; i++) {", "        int ch = code_pair(a[i], b[i]);", "        state = move_state(state, ch);", "        if (i >= last_diff) {", "            Ask ask;", "            ask.need = i - first_diff + 1;", "            ask.state = state;", "            ask.id = id;", "            asks.push_back(ask);", "        }", "    }", "}"]}, "build_fail_tree": {"start": 212, "lines": ["void build_fail_tree() {", "    for (int i = 1; i \u003c node_cnt; i++) {", "        fail_g[node[i].fail].push_back(i);", "    }", "}"]}, "bit_range_add": {"start": 257, "lines": ["void bit_range_add(int l, int r, ll val) {", "    bit_add(l, val);", "    bit_add(r + 1, -val);", "}"]}, "bit_query": {"start": 262, "lines": ["ll bit_query(int pos) {", "    ll res = 0;", "    while (pos > 0) {", "        res += bit[pos];", "        pos -= pos & -pos;", "    }", "    return res;", "}"]}, "answer_offline_asks": {"start": 285, "lines": ["void answer_offline_asks() {", "    bit.assign(node_cnt + 2, 0);", "", "    sort(terminal_nodes.begin(), terminal_nodes.end(), cmp_terminal_depth);", "    sort(asks.begin(), asks.end(), cmp_ask_need);", "", "    int ptr = 0;", "    int term_cnt = terminal_nodes.size();", "    int ask_cnt = asks.size();", "    for (int i = 0; i \u003c ask_cnt; i++) {", "        // 把深度足够的终止节点子树加进树状数组", "        while (ptr \u003c term_cnt && node[terminal_nodes[ptr]].depth >= asks[i].need) {", "            int u = terminal_nodes[ptr];", "            bit_range_add(node[u].tin, node[u].tout, node[u].weight);", "            ptr++;", "        }", "        answer[asks[i].id] += bit_query(node[asks[i].state].tin);", "    }", "}"]}}, "sourceHash": "84fcc604f4385f150a95e3ea1a340a8ab6b7dcb19e6cae9f907690b593aad043", "builtAt": "2026-10-15 12:46", "sample": {"rules": [["xabcx", "xadex"], ["ab", "cd"], ["bc", "de"], ["aa", "bb"]], "queries": [["xabcx", "xadex"], ["aaaa", "bbbb"]]}}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('lesson-data').textContent);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyPair=(a,b)=>(a.charCodeAt(0)-97)*26+b.charCodeAt(0)-97;
const pairText=c=>String.fromCharCode(97+Math.floor(c/26))+'/'+String.fromCharCode(97+c%26);
function brute(rules,a,b){if(a.length!==b.length)return 0;let ans=0;for(const [x,y]of rules)for(let p=0;p+x.length<=a.length;p++)if(a.slice(p,p+x.length)===x&&a.slice(0,p)+y+a.slice(p+x.length)===b)ans++;return ans;}
function buildModel(rules,a,b){
 const nodes=[{id:0,ch:null,parent:-1,depth:0,fail:0,weight:0,rules:[],out:new Map(),path:[]}],ruleEnds=[];
 for(let r=0;r<rules.length;r++){let u=0;const[x,y]=rules[r];if(!x.length||x.length!==y.length)throw Error('规则必须非空且等长');for(let i=0;i<x.length;i++){const c=keyPair(x[i],y[i]);if(!nodes[u].out.has(c)){const v=nodes.length;nodes[u].out.set(c,v);nodes.push({id:v,ch:c,parent:u,depth:nodes[u].depth+1,fail:0,weight:0,rules:[],out:new Map(),path:[...nodes[u].path,c]});}u=nodes[u].out.get(c);}nodes[u].weight++;nodes[u].rules.push(r);ruleEnds.push(u);}
 const edges=u=>[...nodes[u].out.entries()].sort((x,y)=>x[0]-y[0]);const queue=edges(0).map(x=>x[1]);for(let qi=0;qi<queue.length;qi++){const u=queue[qi];for(const[c,v]of edges(u)){let f=nodes[u].fail;while(f&&!nodes[f].out.has(c))f=nodes[f].fail;nodes[v].fail=nodes[f].out.get(c)??0;queue.push(v);}}
 const failChildren=nodes.map(()=>[]);for(let i=1;i<nodes.length;i++)failChildren[nodes[i].fail].unshift(i);
 const tin=[],tout=[],dfsEvents=[],order=[],failDepth=nodes.map(()=>0);let timer=0;
 function dfs(u,stack){tin[u]=++timer;order.push(u);dfsEvents.push({kind:'enter',u,stack:[...stack,u],timer});for(const v of failChildren[u]){failDepth[v]=failDepth[u]+1;dfs(v,[...stack,u]);}tout[u]=timer;dfsEvents.push({kind:'exit',u,stack:[...stack],timer});}dfs(0,[]);
 let L=-1,R=-1;const sameLength=a.length===b.length;if(sameLength)for(let i=0;i<a.length;i++)if(a[i]!==b[i]){if(L<0)L=i;R=i;}
 const chain=u=>{const result=[u];while(u){u=nodes[u].fail;result.push(u);}return result;};
 const scans=[],asks=[];let state=0;
 if(sameLength)for(let i=0;i<a.length;i++){const from=state,c=keyPair(a[i],b[i]),moves=[];while(state&&!nodes[state].out.has(c)){moves.push({kind:'fail',from:state,to:nodes[state].fail});state=nodes[state].fail;}const go=nodes[state].out.get(c)??0;moves.push({kind:nodes[state].out.has(c)?'go':'root',from:state,to:go});state=go;const terminals=chain(state).filter(u=>nodes[u].weight);scans.push({i,from,state,c,moves,chain:chain(state),terminals});if(L>=0&&i>=R){const need=i-L+1;asks.push({i,state,need,id:1,contribution:terminals.filter(u=>nodes[u].depth>=need).reduce((s,u)=>s+nodes[u].weight,0)});}}

}
const cases=[{name:'原题样例 · 两种合法替换',rules:DATA.sample.rules,a:DATA.sample.queries[0][0],b:DATA.sample.queries[0][1]},

const lessons=[
 ['合法替换','匹配成功，还差什么？','替换区间之外，必须已经相同。','仅匹配到原串的一段，是否就能计入答案？',['能，找到规则左串就够了','不能，替换后整个字符串必须等于目标串','能，剩余差异可以再替换一次'],1,'一次替换必须直接得到目标串；区间外完全不变，不能把剩余差异留给第二次替换。'],
 ['字符对','把两次匹配合成一次','一位上同时保存原字符与目标字符。','为了同时检查规则左右两串，新字符应该记录什么？',['有序对（原字符，目标字符）','只有原字符','只有两个字符是否相同'],0,'字符对保留完整方向和内容。只有“相同/不同”会把 a→b 与 a→c 混为一谈。'],
 ['AC 匹配','找到以这里结尾的所有规则','当前状态和它的 fail 链共同给出匹配。','扫描到一个位置时，应该在哪里找全部匹配规则？',['当前状态的 Trie 祖先','只看当前状态是否终止','当前状态自身及其 fail 链上的终止节点'],2,'Trie 祖先是前缀；以当前位置结尾的规则是后缀，应沿 fail 链找，并包含当前状态自身。'],
 ['覆盖与长度','为什么要有 need？','把覆盖 [L,R] 改写成长度下界。','匹配结束于 i，长度为 k。要覆盖第一个差异 L，需要什么？',['k ≤ i−L+1','k ≥ i−L+1','k 恰好等于 R−L+1'],1,'起点为 i−k+1。起点不晚于 L，等价于 k ≥ i−L+1；同时结束位置还必须 i ≥ R。'],
 ['fail 树','把祖先关系反过来看','u 在 v 的 fail 链上，等价于 v 在 u 的子树里。','规则终点 u 在状态 v 的 fail 链上。改看 fail 树时，哪个关系成立？',['v 在 u 的 fail 子树中（包含 u 本身）','u 在 v 的 fail 子树中','u 和 v 必须是兄弟'],0,'父指针就是 fail。沿 v 的父指针能到 u，意味着 u 是祖先，也意味着 v 在 u 的子树里。'],
 ['DFS 序','子树为什么是一个区间？','亲自进入、退出节点，看区间形成。','DFS 已经进入 u。在退出 u 之前，能访问 u 子树以外的节点吗？',['可以，DFS 会随时跳到根的其他分支','可以，只要下一个节点编号更小','不能，要先完整走完 u 的所有孩子子树'],2,'DFS 进入一棵子树后，必须先完成它再返回父节点，所以这段新编号不会夹入子树外的节点。'],
 ['离线计数','长度门槛降低，规则逐步加入','对子树加权，对当前状态单点查询。','一个终止规则 u 的长度满足门槛时，应该给哪里加上它的权重？',['只给节点 u 加','整棵 fail 子树加','整棵原 Trie 子树加'],1,'u 的 fail 子树里，每个状态都以 u 对应的规则为后缀。给整棵子树加权，才能让这些状态都查到该规则。'],

// Keep range controls mounted while their surrounding explanation updates.
function patchHTML(target,html){
 const template=document.createElement('template');template.innerHTML=html;
 function sync(parent,fresh){
  let old=parent.firstChild;
  for(const next of [...fresh.childNodes]){
   if(!old){parent.appendChild(next.cloneNode(true));continue;}
   const after=old.nextSibling;
   if(old.nodeType!==next.nodeType||old.nodeName!==next.nodeName){parent.replaceChild(next.cloneNode(true),old);}
   else if(old.nodeType===Node.TEXT_NODE){if(old.data!==next.data)old.data=next.data;}
   else if(old.nodeType===Node.ELEMENT_NODE){
    for(const a of [...old.attributes])if(!next.hasAttribute(a.name)&&!(a.name==='open'&&old.tagName==='DETAILS'))old.removeAttribute(a.name);
    for(const a of [...next.attributes])if(old.getAttribute(a.name)!==a.value)old.setAttribute(a.name,a.value);
    if(old.tagName==='INPUT')old.value=next.value;
    sync(old,next);
   }
   old=after;
  }
  while(old){const after=old.nextSibling;parent.removeChild(old);old=after;}
 }
 sync(target,template.content);
}

function dfsSnapshot(count){const entered=new Set(),exited=new Set(),knownTin={},knownTout={};let stack=[],last=null;for(const event of model.dfsEvents.slice(0,count)){last=event;stack=event.stack;if(event.kind==='enter'){entered.add(event.u);knownTin[event.u]=event.timer;}else{exited.add(event.u);knownTout[event.u]=event.timer;}}return{entered,exited,knownTin,knownTout,stack,last};}

 bindTransport('dfs','dfsStep',model.dfsEvents.length);$('subtree-select').onchange=e=>{ui.u=+e.target.value;renderDemo();};$('dfs-finish').onclick=()=>{stop();ui.dfsStep=model.dfsEvents.length;renderDemo();};bindGraph(n=>{ui.u=n;renderDemo();});

function offlineSnapshot(count){const N=model.nodes.length,bit=Array(N+2).fill(0),diff=Array(N+2).fill(0),active=new Set(),answered=new Map();let total=0,last=null;
 const add=(p,v)=>{for(;p<bit.length;p+=p&-p)bit[p]+=v;};const point=p=>{let r=0;for(;p>0;p-=p&-p)r+=bit[p];return r;};
 for(const op of model.ops.slice(0,count)){last=op;if(op.kind==='activate'){const l=model.tin[op.u],r=model.tout[op.u],w=model.nodes[op.u].weight;active.add(op.u);diff[l]+=w;diff[r+1]-=w;add(l,w);add(r+1,-w);}else{const got=point(model.tin[op.ask.state]);answered.set(op.ask.i,got);total+=got;}}
 return{bit,diff,active,answered,total,last,values:model.order.map(u=>point(model.tin[u])),point};
}

((u,i)=>`<div class="dfs-tile ${focusNode!==undefined&&subtree(focusNode,u)?'selected':''} ${u===state?'point':''}"><small>序 ${i+1} · u${u}</small><b>${snap.values[i]}</b></div>`).join('')}</div><details><summary>展开：差分数组和树状数组内部值</summary><p class="small muted">上面的单点值是差分前缀和，不是 Fenwick 内部数组。内部 bit[pos] 保存的是 lowbit 区间和。</p><div class="table-wrap"><table><thead><tr><th>DFS 位置</th>${Array.from({length:model.nodes.length+1},(_,i)=>`<th>${i+1}</th>`).join('')}</tr></thead><tbody><tr><td>差分 d[pos]</td>${snap.diff.slice(1).map(v=>`<td>${v}</td>`).join('')}</tr><tr><td>内部 bit[pos]</td>${snap.bit.slice(1).map(v=>`<td>${v}</td>`).join('')}</tr></tbody></table></div><p class="small">最后一个位置 N+1 是差分右端的哨兵，不对应 AC 节点。</p></details><div class="note warning"><b>长度达标 ≠ 在当前位置匹配。</b>长度只决定是否激活；查询状态是否落在终止节点的 fail 子树内，才决定这个规则能否贡献。两种限制由不同步骤分别保证。</div>${ui.offlineStep===model.ops.length?`<p class="takeaway">离线处理结束：答案 = ${snap.total}。与直接枚举替换得到的 ${model.expected} 一致。</p>`:''}${source('answer_offline_asks','ptr 保证每个合格终点只加入一次；区间加的是 node[].weight，查询点是 tin[state]。')}</section>`;
 bindTransport('offline','offlineStep',model.ops.length);defaultGraphBinding();
}
