<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="920" height="560" fill="#ffffff"/>

  <text x="460" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">为什么"超过一半"的方向至多只有一个</text>

  <rect x="355" y="62" width="210" height="56" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="460" y="96" text-anchor="middle" font-size="13" fill="#475569">u 上方（父方向）</text>
  <line x1="460" y1="118" x2="460" y2="146" stroke="#94a3b8" stroke-width="2.5"/>

  <circle cx="460" cy="172" r="26" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="460" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">u</text>

  <line x1="438" y1="194" x2="290" y2="300" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="482" y1="194" x2="630" y2="300" stroke="#94a3b8" stroke-width="2.5"/>

  <rect x="150" y="300" width="230" height="110" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="265" y="336" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">子树 A</text>
  <text x="265" y="368" text-anchor="middle" font-size="14" fill="#b91c1c">sz(A) &gt; ⌊m/2⌋</text>

  <rect x="540" y="300" width="230" height="110" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="655" y="336" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">子树 B</text>
  <text x="655" y="368" text-anchor="middle" font-size="14" fill="#b91c1c">sz(B) &gt; ⌊m/2⌋</text>

  <text x="460" y="252" text-anchor="middle" font-size="17" font-weight="bold" fill="#dc2626">两个都超过一半？</text>

  <rect x="110" y="440" width="700" height="80" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="130" y="472" font-size="15" font-weight="bold" fill="#c2410c">sz(A) + sz(B) &gt; 2·⌊m/2⌋</text>
  <text x="130" y="500" font-size="14" fill="#9a3412">但 A、B 都在 u 下面且互不相交，两者之和至多 m − 1，矛盾</text>
</svg>
