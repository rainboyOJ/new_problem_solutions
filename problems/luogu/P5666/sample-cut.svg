<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="1040" height="660" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="520" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">样例 1：切掉边 (1,2)，两侧各自求重心</text>

  <!-- 左半（原树） -->
  <text x="170" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">原树</text>
  <line x1="170" y1="150" x2="170" y2="270" stroke="#dc2626" stroke-width="3" stroke-dasharray="7,5"/>
  <line x1="170" y1="270" x2="90" y2="400" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="170" y1="270" x2="250" y2="400" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="90" y1="400" x2="90" y2="530" stroke="#94a3b8" stroke-width="2.5"/>

  <rect x="146" y="196" width="48" height="30" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="170" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">切</text>

  <circle cx="170" cy="150" r="25" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="170" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">1</text>
  <circle cx="170" cy="270" r="25" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="170" y="276" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">2</text>
  <circle cx="90" cy="400" r="25" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="90" y="406" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">3</text>
  <circle cx="250" cy="400" r="25" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="250" y="406" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">4</text>
  <circle cx="90" cy="530" r="25" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="90" y="536" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">5</text>

  <!-- 分割竖线 -->
  <line x1="390" y1="70" x2="390" y2="640" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 右上（单点连通块） -->
  <rect x="430" y="100" width="570" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="500" cy="155" r="25" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <text x="500" y="161" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">1</text>
  <text x="550" y="140" font-size="14" font-weight="bold" fill="#1e40af">连通块 {1}</text>
  <text x="550" y="168" font-size="13" fill="#1e40af">大小 1，重心就是 1</text>
  <text x="550" y="192" font-size="13" fill="#475569">切掉 (1,2) 后它和 2 不再相连</text>

  <!-- 右下（四点连通块） -->
  <rect x="430" y="240" width="570" height="390" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="450" y="270" font-size="14" font-weight="bold" fill="#166534">连通块 {2,3,4,5}</text>
  <line x1="620" y1="360" x2="540" y2="480" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="620" y1="360" x2="700" y2="480" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="540" y1="480" x2="540" y2="590" stroke="#94a3b8" stroke-width="2.5"/>

  <circle cx="620" cy="360" r="25" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
  <text x="620" y="366" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">2</text>
  <circle cx="540" cy="480" r="25" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
  <text x="540" y="486" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">3</text>
  <circle cx="700" cy="480" r="25" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="700" y="486" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">4</text>
  <circle cx="540" cy="590" r="25" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="540" y="596" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">5</text>

  <text x="770" y="350" font-size="15" font-weight="bold" fill="#c2410c">重心 {2,3}</text>
  <text x="770" y="378" font-size="13" fill="#9a3412">sz[3] = 2，2 × 2 = 4 = m</text>
  <text x="770" y="403" font-size="13" fill="#9a3412">恰好一半，所以有两个重心</text>
  <text x="770" y="428" font-size="13" fill="#9a3412">两个重心一定相邻</text>
  <text x="770" y="470" font-size="13" fill="#475569">橙色圈 = 重心</text>
</svg>
