<circle cx="170.0" cy="350.0" r="20.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="170.0" y="355.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">1</text>
<circle cx="105.0" cy="430.0" r="20.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="105.0" y="435.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">2</text>
<circle cx="235.0" cy="430.0" r="20.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="235.0" y="435.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">3</text>
<circle cx="65.0" cy="510.0" r="20.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="65.0" y="515.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">4</text>
<circle cx="145.0" cy="510.0" r="20.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/><text x="145.0" y="515.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">5</text>
<circle cx="141.0" cy="327.0" r="8" fill="none" stroke="#d97706" stroke-width="1.6"/>
<text x="141.0" y="331.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#d97706" text-anchor="middle" font-weight="normal">自</text>
<circle cx="76.0" cy="407.0" r="8" fill="none" stroke="#d97706" stroke-width="1.6"/>
<text x="76.0" y="411.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#d97706" text-anchor="middle" font-weight="normal">自</text>
<line x1="221.75755487301623" y1="413.70160599755843" x2="190.17896400302288" y2="374.8356480037205" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="184.5,367.9 193.7,372.0 186.7,377.7" fill="#2563eb"/>
<line x1="74.39148550549912" y1="491.2170289890018" x2="90.68916494400135" y2="458.6216701119973" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="94.7,450.6 94.7,460.6 86.7,456.6" fill="#2563eb"/>
<line x1="135.6085144945009" y1="491.2170289890018" x2="119.31083505599865" y2="458.6216701119973" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="115.3,450.6 123.3,456.6 115.3,460.6" fill="#2563eb"/>
<text x="20" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#d97706" text-anchor="start" font-weight="normal">橙圈 = 有标记，自己当代表元（画作「自」）</text>
<text x="20" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="normal">蓝虚箭头 = 无标记，直接指向父亲</text>
<text x="20" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">3 → 1</text>
<text x="20" y="303" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">4 → 2</text>
<text x="20" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">5 → 2</text>
<rect x="452" y="196" width="468" height="232" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="468" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">为什么 find(u) 就是「最近的标记祖先」</text>
<text x="468" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">find(4)</text>
<text x="548" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">4 → 2，2 有标记且指向自己 → 停</text>
<text x="904" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#059669" text-anchor="end" font-weight="bold">答案 2</text>
<text x="468" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">find(5)</text>
<text x="548" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">5 → 2，同上 → 停</text>
<text x="904" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#059669" text-anchor="end" font-weight="bold">答案 2</text>
<text x="468" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">find(3)</text>
<text x="548" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">3 → 1，1 有标记 → 停</text>
<text x="904" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#059669" text-anchor="end" font-weight="bold">答案 1</text>
<text x="468" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">find(2)</text>
<text x="548" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">2 自己就带标记 → 立刻停</text>
<text x="904" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#059669" text-anchor="end" font-weight="bold">答案 2</text>
<text x="468" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">指针只往父亲方向走，所以第一个「不动」的点就是最近的标记。</text>
<rect x="20" y="610" width="900" height="58" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
<text x="36" y="636" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#059669" text-anchor="start" font-weight="bold">注意：根 1 有初始标记，所以 mark_cnt[1] = 1 且永不减到 0 —— 任何询问都至少能停在根。</text>
<text x="36" y="658" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">「节点本身也算自己的祖先」正体现在 find(2) 直接返回 2：自环让查询在出发点就结束。</text>
</svg>
