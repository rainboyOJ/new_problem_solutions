<text x="366" y="527" font-size="9.5" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle" font-weight="normal">x=3</text>
<text x="474" y="512" font-size="10.5" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle" font-weight="normal">组 4</text>
