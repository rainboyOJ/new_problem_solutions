<text x="582" y="512" font-size="10.5" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle" font-weight="normal">组 5</text>
<text x="582" y="527" font-size="9.5" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle" font-weight="normal">x=5</text>
<text x="690" y="512" font-size="10.5" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">组 6</text>
<text x="690" y="527" font-size="9.5" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle" font-weight="normal">x=6</text>
<text x="798" y="512" font-size="10.5" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle" font-weight="normal">组 7</text>
<text x="798" y="527" font-size="9.5" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle" font-weight="normal">x=7</text>
<text x="906" y="512" font-size="10.5" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle" font-weight="normal">补齐</text>
<text x="690" y="548" font-size="11.5" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">命中！</text>
<text x="690" y="564" font-size="10.5" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">就是这一组</text>
<text x="24" y="588" font-size="12" fill="#15803d" text-anchor="start" dominant-baseline="middle" font-weight="normal">先左后右：每一层都是「左儿子还有可能就向左，否则向右」，所以第一个被命中的叶子必然是组号最小的那个。</text>
<text x="24" y="613" font-size="12" fill="#334155" text-anchor="start" dominant-baseline="middle" font-weight="normal">两种剪枝各管一件事，缺一个就退化：r &lt; start 管「这段整体落在查询点左边」，mx ≤ 3 管「这段里没有一个 y 够大的点」。</text>
<text x="24" y="638" font-size="12" fill="#334155" text-anchor="start" dominant-baseline="middle" font-weight="normal">被剪掉的结点只花一次比较就整段放弃，真正向下走的只有通往答案的那一条路径 —— 这就是单次查询 O(log n) 的来源。</text>
<text x="24" y="663" font-size="12" fill="#1d4ed8" text-anchor="start" dominant-baseline="middle" font-weight="normal">落到组 6 的叶子只能说明「这组有戏」，具体哪个 y 最小，要交给第三步的组内查找。</text>
