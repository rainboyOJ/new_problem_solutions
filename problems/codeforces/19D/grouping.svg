<text x="24" y="682" font-size="12" fill="#334155" text-anchor="start" dominant-baseline="middle" font-weight="normal">每组一个竖直小组（浅框）：装当前挂在这个 x 上的所有 y，柱顶就是组内最大 y。</text>
<text x="24" y="708" font-size="12" fill="#334155" text-anchor="start" dominant-baseline="middle" font-weight="normal">柱顶这件事就是线段树叶子存的内容 —— 二维查询的第一维（x）变成了线段树的下标，第二维（y）缩成每个下标上的一个数。</text>
<text x="24" y="734" font-size="12" fill="#b91c1c" text-anchor="start" dominant-baseline="middle" font-weight="normal">注意组 1、组 3：它们的柱顶 5、9 都比 3 大，但 x ≤ 3，不满足「严格大于」，所以整列被灰色虚线罩掉 —— 这就是下降时必须带「越界」剪枝的原因。</text>
<text x="24" y="760" font-size="12" fill="#c2410c" text-anchor="start" dominant-baseline="middle" font-weight="normal">空组（组 2、组 5）的叶子存 -1：坐标非负，-1 一定不满足 y &gt; 3，等价于「这组恒无答案」。</text>
</svg>
