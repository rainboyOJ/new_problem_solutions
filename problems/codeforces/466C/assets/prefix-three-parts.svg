<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">三段等和与前缀和的关系</title>
<desc id="desc">两刀位于 p 和 q，每段和为 x。前缀和 S_p 覆盖第一段，S_q 覆盖前两段，总和 T 覆盖三段，所以 S_p=x，S_q=2x，T=3x。</desc>
<rect width="900" height="400" rx="16" fill="#fff"/>
<g font-family="sans-serif" text-anchor="middle" fill="#243247">
<text x="450" y="36" font-size="23" font-weight="bold">每段和相等，前缀和逐段累计</text>
<rect x="90" y="92" width="240" height="72" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<rect x="330" y="92" width="240" height="72" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<rect x="570" y="92" width="240" height="72" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<g font-size="17"><text x="210" y="116">第一段 [1, p]</text><text x="450" y="116">第二段 [p+1, q]</text><text x="690" y="116">第三段 [q+1, n]</text></g>
<g font-size="23" font-weight="bold"><text x="210" y="147">和 = x</text><text x="450" y="147">和 = x</text><text x="690" y="147">和 = x</text></g>
<g stroke="#475569" stroke-width="2" stroke-dasharray="4 4"><path d="M330 68V177"/><path d="M570 68V177"/></g>
<g font-size="17"><text x="330" y="65">第一刀 p</text><text x="570" y="65">第二刀 q</text><text x="90" y="185">0</text><text x="810" y="185">n</text></g>
<g fill="none" stroke-width="3"><path d="M90 207v9h240v-9" stroke="#2563eb"/><path d="M90 255v9h480v-9" stroke="#16a34a"/><path d="M90 303v9h720v-9" stroke="#ea580c"/></g>
<g font-size="19"><text x="210" y="241" fill="#1d4ed8">Sₚ = x</text><text x="330" y="289" fill="#15803d">Sᵩ = x + x = 2x</text><text x="450" y="337" fill="#c2410c">T = x + x + x = 3x</text></g>
<rect x="240" y="354" width="420" height="34" rx="8" fill="#f1f5f9"/>
<text x="450" y="378" font-size="20" font-weight="bold">切点条件：3Sₚ = T，Sᵩ = 2Sₚ</text>
</g></svg>
