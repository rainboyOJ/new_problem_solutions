<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
  <title>分层图最短路 3D 透视结构演示图</title>
  <desc>展示多层世界中的层内行驶（一直开）与垂直降落（换车）机制</desc>

  <defs>
    <!-- 箭头标记 -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#555555" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1d63b8" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d9531e" />
    </marker>
    <!-- 平面渐变与阴影 -->
    <linearGradient id="plane-upper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#edf2f7" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="plane-lower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e2f5ea" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- 图注与标题区域 -->
  <text x="440" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#1e293b">分层图多层停车场模型：层内平移与层间换车</text>
  <text x="440" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" fill="#64748b">每个速度系数对应一层平行地图，遇到更快自行车等价于“以代价 0 乘垂直电梯降落至更优层”</text>

  <!-- ==================== 1. 上层平面（慢车世界：系数 s_slow = 5） ==================== -->
  <g id="layer-upper">
    <!-- 平面轮廓 (等轴测投影视角) -->
    <polygon points="140,110 740,110 600,290 0,290" fill="url(#plane-upper)" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="35" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#64748b">第 5 层：慢车世界 (骑着系数 s=5 的车)</text>

    <!-- 上层网络连线（同层行驶） -->
    <!-- (1, 5) -> (2, 5) 边权 w=2 * 5 = 10 -->
    <line x1="160" y1="230" x2="330" y2="160" stroke="#1d63b8" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <!-- (2, 5) -> (4, 5) 边权 w=5 * 5 = 25 -->
    <line x1="330" y1="160" x2="520" y2="170" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
    <!-- (1, 5) -> (3, 5) -->
    <line x1="160" y1="230" x2="310" y2="245" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- 边权标注 -->
    <rect x="205" y="175" width="84" height="22" rx="4" fill="#ffffff" stroke="#1d63b8" stroke-width="1" />
    <text x="247" y="191" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1d63b8" text-anchor="middle">w × 5 = 10</text>

    <!-- 上层节点 -->
    <!-- 节点 1(起点) -->
    <circle cx="160" cy="230" r="16" fill="#1d63b8" stroke="#0f172a" stroke-width="2" />
    <text x="160" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="130" y="255" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">起点 (1, s=5)</text>

    <!-- 节点 2 -->
    <circle cx="330" cy="160" r="16" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <text x="330" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">2</text>
    <text x="330" y="138" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155" text-anchor="middle">城市 2 (售 s=2)</text>

    <!-- 节点 3 -->
    <circle cx="310" cy="245" r="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="310" y="250" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">3</text>

    <!-- 节点 4 -->
    <circle cx="520" cy="170" r="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="520" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">4</text>
  </g>

  <!-- ==================== 2. 垂直穿梭层间转移（换车垂直电梯） ==================== -->
  <g id="vertical-transition">
    <!-- 城市 2 原地换车下潜：(2, 5) -> (2, 2)，代价 0 -->
    <path d="M 330,176 L 330,374" stroke="#d9531e" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-orange)" />
    <!-- 标签框 -->
    <rect x="342" y="260" width="168" height="42" rx="6" fill="#ffffff" stroke="#d9531e" stroke-width="1.5" />
    <text x="350" y="278" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#d9531e">原地换乘新车 (耗时 0)</text>
    <text x="350" y="294" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">垂直降落至 s=2 层</text>
  </g>

  <!-- ==================== 3. 下层平面（神车世界：系数 s_fast = 2） ==================== -->
  <g id="layer-lower">
    <!-- 平面轮廓 -->
    <polygon points="140,330 740,330 600,510 0,510" fill="url(#plane-lower)" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="35" y="495" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#15803d">第 2 层：神车世界 (骑着更快的 s=2 的车)</text>

    <!-- 下层网络连线（同层行驶，速度更快！） -->
    <!-- (2, 2) -> (4, 2) 边权 w=5 * 2 = 10 (比上层的 25 快两倍以上！) -->
    <line x1="330" y1="380" x2="520" y2="390" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <!-- (4, 2) -> (5, 2) 终点 边权 w=1 * 2 = 2 -->
    <line x1="520" y1="390" x2="660" y2="440" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <!-- 其它辅助线 -->
    <line x1="160" y1="450" x2="330" y2="380" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="330" y1="380" x2="310" y2="465" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- 边权标注 -->
    <rect x="385" y="368" width="80" height="22" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1" />
    <text x="425" y="384" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">w × 2 = 10</text>

    <rect x="565" y="400" width="76" height="22" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1" />
    <text x="603" y="416" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">w × 2 = 2</text>

    <!-- 下层节点 -->
    <circle cx="160" cy="450" r="14" fill="#f8fafc" stroke="#bbf7d0" stroke-width="1.5" />
    <text x="160" y="455" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">1</text>

    <!-- 节点 2 (换车落点) -->
    <circle cx="330" cy="380" r="16" fill="#dcfce7" stroke="#15803d" stroke-width="2.5" />
    <text x="330" y="385" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">2</text>

    <!-- 节点 4 -->
    <circle cx="520" cy="390" r="16" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
    <text x="520" y="395" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">4</text>

    <!-- 节点 5 (聚会终点) -->
    <circle cx="660" cy="440" r="18" fill="#15803d" stroke="#052e16" stroke-width="2.5" />
    <text x="660" y="445" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="660" y="475" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">终点 (5, s=2)</text>
  </g>

  <!-- 底部图例解释 -->
  <g transform="translate(180, 525)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#1d63b8" stroke-width="2.5" />
    <text x="36" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">同层正常骑行（边权 w · s_k）</text>

    <line x1="220" y1="10" x2="250" y2="10" stroke="#d9531e" stroke-width="2.5" stroke-dasharray="4,3" />
    <text x="256" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">垂直层间换车（边权 0，跳入更快车层）</text>

    <circle cx="510" cy="10" r="6" fill="#15803d" />
    <text x="522" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">任意层到达终点 n 的最小值即为全局最优</text>
  </g>
</svg>
