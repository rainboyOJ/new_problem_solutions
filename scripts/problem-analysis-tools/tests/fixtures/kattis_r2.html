    <div class="problembody">
      <p>The number <span class="tex2jax_process">$S$</span> is called the mean of two numbers
      <span class="tex2jax_process">$R_1$</span> and <span class="tex2jax_process">$R_2$</span>.</p>

      <h2>Input</h2>
      <p>The first and only line of input contains two integers
      <span class="tex2jax_process">$R_1$</span> and <span class="tex2jax_process">$S$</span>.</p>

      <h2>Output</h2>
      <p>Output <span class="tex2jax_process">$R_2$</span> on a single line.</p>

</pre></td>
