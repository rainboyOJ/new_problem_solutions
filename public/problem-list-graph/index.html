#app{display:flex;align-items:flex-start;gap:0}
aside{width:250px;flex:0 0 250px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;background:#fff;border-right:1px solid var(--line);padding:8px}
.cat{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-weight:600}

.cat.on{background:var(--accbg);color:var(--acc)}

.bar input[type=search]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grp{margin:16px 0 6px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.grp .gsub{color:var(--sub);font-weight:400;font-size:12px}
.p{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:5px 0;flex-wrap:wrap}
.p:hover{border-color:#c3cad6}
.pid{font-family:Consolas,monospace;font-weight:700;text-decoration:none;color:var(--acc);flex:0 0 auto}
.pname{flex:1;min-width:180px}
.badge{font-size:11px;padding:1px 7px;border-radius:9px;white-space:nowrap}
.diff{color:#fff}
.d1{background:var(--d1)}.d2{background:var(--d2)}.d3{background:var(--d3);color:#5a4b00}
.d4{background:var(--d4)}.d5{background:var(--d5)}.d6{background:var(--d6)}.d7{background:var(--d7)}
.d0{background:#c9ced6;color:#3a3f47}
.tier{border:1px solid var(--line)}
.t0{background:#fff4d6;border-color:#e8c15a;color:#8a6100}
.t1{background:#eef6ff;border-color:#a9cdf5;color:#1c5fb0}
.t2{background:#f1f8f0;border-color:#b4ddb0;color:#2f7a2b}
.t3{background:#f5f5f5;color:#666}
.slv{color:#9aa1ab;font-size:11px}
.src{font-size:11px;color:var(--sub);background:#f2f3f5;border-radius:8px;padding:1px 7px}
.kt{font-size:11px;color:var(--acc);background:var(--accbg);border-radius:8px;padding:1px 7px;cursor:pointer}
.tpl{font-size:11px;color:#b45309;background:#fef3c7;border-radius:8px;padding:1px 7px}
.summary{color:var(--sub);font-size:12px;margin:4px 0 8px}
@media(max-width:820px){aside{display:none}}
</style>

<script>
var P=DATA.problems;
var state={view:'topic',cat:'',sub:'',q:'',diffs:new Set(),tiers:new Set(),srcs:new Set(),tpl:false};
var TN=DATA.tierName;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}

function initHeader(){
  document.getElementById('hdmeta').textContent='共 '+DATA.total+' 题 · 生成于 '+DATA.generated+' · 数据源：约150位洛谷金牌选手做题记录';
  var db=document.getElementById('diffbar');
  DATA.diffOrder.forEach(function(d){
    var s=document.createElement('span');s.className='chip';s.textContent=d;
    s.onclick=function(){toggle(state.diffs,d);s.classList.toggle('on');render();};
    db.appendChild(s);
  });
  var tb=document.getElementById('tierbar');
  ['T0','T1','T2','T3'].forEach(function(t){
    var s=document.createElement('span');s.className='chip';s.textContent=t+' '+TN[t]+' ('+(DATA.tierCount[t]||0)+')';
    s.onclick=function(){toggle(state.tiers,t);s.classList.toggle('on');render();};
    tb.appendChild(s);
  });
  var sb=document.getElementById('srcbar');
  DATA.sources.forEach(function(o){
    var s=document.createElement('span');s.className='chip';s.textContent=o.name+' ('+o.count+')';
    s.onclick=function(){toggle(state.srcs,o.name);s.classList.toggle('on');render();};
    sb.appendChild(s);
  });
  var tgl=document.querySelector('[data-t=tpl]');
  tgl.onclick=function(){state.tpl=!state.tpl;tgl.classList.toggle('on');render();};
  document.querySelectorAll('.views button').forEach(function(b){
    b.onclick=function(){
      state.view=b.dataset.v;
      document.querySelectorAll('.views button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      if(state.view!=='topic'){state.cat='';state.sub='';}
      renderSidebar();render();
    };
  });
  document.getElementById('q').oninput=function(e){state.q=e.target.value.trim().toLowerCase();render();};
}
function toggle(set,v){ if(set.has(v))set.delete(v); else set.add(v); }

function renderSidebar(){
  var el=document.getElementById('sidebar');el.innerHTML='';
  var all=document.createElement('div');all.className='cat'+(state.cat===''?' on':'');
  all.innerHTML='<span>全部题目</span><span class="cnt">'+DATA.total+'</span>';
  all.onclick=function(){state.cat='';state.sub='';state.view='topic';renderSidebar();render();};
  el.appendChild(all);
  DATA.categories.forEach(function(c){
    var d=document.createElement('div');d.className='cat'+(state.cat===c.name?' on':'');
    d.innerHTML='<span>'+esc(c.name)+'</span><span class="cnt">'+c.count+'</span>';
    d.onclick=function(){
      state.view='topic';
      if(state.cat===c.name){state.cat='';state.sub='';}
      else{state.cat=c.name;state.sub='';}
      renderSidebar();render();
    };
    el.appendChild(d);
    if(state.cat===c.name){
      c.subs.forEach(function(s){
        var e=document.createElement('div');e.className='sub'+(state.sub===s.name?' on':'');
        e.innerHTML='<span>'+esc(s.name)+'</span><span class="cnt">'+s.count+'</span>';
        e.onclick=function(ev){ev.stopPropagation();state.sub=(state.sub===s.name?'':s.name);renderSidebar();render();};
        el.appendChild(e);
      });
    }
  });
}

function match(p){
  if(state.tpl && !p.tpl) return false;
  if(state.diffs.size && !state.diffs.has(p.diff)) return false;
  if(state.tiers.size && !state.tiers.has(p.tier)) return false;
  if(state.srcs.size && !p.sources.some(function(s){return state.srcs.has(s);})) return false;
  if(state.q){
    var s=(p.id+' '+p.name).toLowerCase();
    if(s.indexOf(state.q)<0) return false;
  }
  if(state.view==='topic' && state.cat){
    if(!p.cats.some(function(c){return c[0]===state.cat && (!state.sub||c[1]===state.sub);})) return false;
  }
  if(state.view==='quick' && p.tier!=='T0' && p.tier!=='T1') return false;
  if(state.view==='tpl' && !p.tpl) return false;
  return true;
}

function rowHTML(p){
  var s='<div class="p">';
  s+='<a class="pid" href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.id)+'</a>';
  s+='<span class="pname">'+esc(p.name)+'</span>';
  s+='<span class="badge diff d'+p.rk+'">'+esc(p.diff)+'</span>';
  s+='<span class="badge tier '+p.tier+'">'+TN[p.tier]+'</span>';
  s+='<span class="slv">'+p.solvers+'人</span>';
  if(p.tpl) s+='<span class="tpl">模板</span>';
  p.sources.slice(0,3).forEach(function(x){s+='<span class="src">'+esc(x)+'</span>';});
  p.cats.slice(0,6).forEach(function(c){s+='<span class="kt">'+esc(c[0])+'·'+esc(c[1])+'</span>';});
  s+='</div>';
  return s;
}

function render(){
  var arr=P.filter(match);
  var el=document.getElementById('list');
  var sum=document.getElementById('summary');
  sum.textContent='当前显示 '+arr.length+' 题';
  if(!arr.length){el.innerHTML='<p style="color:#6b7280">没有符合条件的题目。</p>';return;}

  var groups=[]; // [title, subtitle, items]
  function groupBy(keyFn,titleFn,orderKeys){
    var m={};
    arr.forEach(function(p){var k=keyFn(p);if(k==null)return;(m[k]=m[k]||[]).push(p);});
    var keys=orderKeys?orderKeys.filter(function(k){return m[k];}):Object.keys(m);
    keys.forEach(function(k){groups.push({t:titleFn(k),sub:m[k].length+' 题',items:m[k]});});
  }

  if(state.view==='topic'){
    if(state.cat && state.sub){
      groupBy(function(p){return 'x';},function(){return state.cat+' · '+state.sub;});
    }else if(state.cat){
      groupBy(function(p){var f=p.cats.filter(function(c){return c[0]===state.cat;})[0];return f?f[1]:'其他';},
              function(k){return state.cat+' · '+k;});
    }else{
      groupBy(function(p){return p.cats.length?p.cats[0][0]:'其他技巧';},function(k){return k;},DATA.categories.map(function(c){return c.name;}));
    }
  }else if(state.view==='path'){
    groupBy(function(p){return p.stage;},function(k){return k;},DATA.stageOrder);
  }else if(state.view==='quick'){
    groupBy(function(p){return p.diff;},function(k){return '难度：'+k;},DATA.diffOrder.concat(['未评定']));
  }else if(state.view==='tpl'){
    groupBy(function(p){return p.cats.length?p.cats[0][0]:'其他技巧';},function(k){return k;},DATA.categories.map(function(c){return c.name;}));
  }

  var html='';
  groups.forEach(function(g){
    var items=g.items.slice().sort(function(a,b){
      return a.rk-b.rk || b.solvers-a.solvers || (a.id<b.id?-1:1);
    });
    html+='<div class="grp">'+esc(g.t)+' <span class="gsub">'+g.sub+'</span></div>';
    items.forEach(function(p){html+=rowHTML(p);});
  });
  el.innerHTML=html;
}

initHeader();renderSidebar();render();
</script>
</body>
</html>
